  <rect x="70" y="24" width="250" height="64" rx="14" fill="#eef3ec" stroke="#2f6f5e" stroke-width="2"/>
  <rect x="70" y="116" width="250" height="64" rx="14" fill="#f3f0e7" stroke="#8a7b63" stroke-width="2"/>
  <rect x="70" y="208" width="250" height="64" rx="14" fill="#e9f0f2" stroke="#527b88" stroke-width="2"/>
  <rect x="70" y="300" width="250" height="64" rx="14" fill="#f5eee8" stroke="#9a765e" stroke-width="2"/>
