  <text x="670" y="159" text-anchor="middle" font-size="20" font-weight="700" fill="#24332e">서로 이어지는 영향</text>
  <text x="670" y="199" text-anchor="middle" font-size="16" fill="#3c5149">한 곳의 결정이 다른 곳에 닿고</text>
  <text x="670" y="229" text-anchor="middle" font-size="16" fill="#3c5149">다른 규모의 대응이 다시 연결됨</text>
