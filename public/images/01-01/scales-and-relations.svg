  <text x="226" y="247" text-anchor="middle" font-size="16" fill="#435d63">기관 · 공동체</text>
  <text x="110" y="339" text-anchor="middle" font-size="18" font-weight="700" fill="#49382f">개인</text>
  <text x="226" y="339" text-anchor="middle" font-size="16" fill="#665044">선택 · 참여</text>
  <path d="M395 58 C465 58 465 150 395 150" fill="none" stroke="#527b88" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M395 150 C465 150 465 242 395 242" fill="none" stroke="#527b88" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M395 242 C465 242 465 334 395 334" fill="none" stroke="#527b88" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
