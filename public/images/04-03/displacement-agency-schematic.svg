<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">강제 이주 뒤의 선택과 참여</title>
  <desc id="svg-desc">안전과 생계, 가족 관계, 제도와 정보 여건 속에서 난민이 선택을 하고 지역 사회와 함께 생활을 만들어 간다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55746d" />
    </marker>
  </defs>
  <rect width="1120" height="500" rx="28" fill="#fbf8f1" />
  <g font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <rect x="62" y="46" width="286" height="78" rx="18" fill="#e8efeb" stroke="#9db3a9" stroke-width="2" />
    <text x="205" y="94" fill="#203832">안전·생계 여건</text>
    <rect x="417" y="46" width="286" height="78" rx="18" fill="#f1e9d9" stroke="#c6b79c" stroke-width="2" />
    <text x="560" y="94" fill="#40372a">가족·관계</text>
    <rect x="772" y="46" width="286" height="78" rx="18" fill="#e9edf1" stroke="#aab7c5" stroke-width="2" />
    <text x="915" y="94" fill="#263642">제도·정보 접근</text>
  </g>
  <g fill="none" stroke="#78948b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 205 126 C 235 164, 335 176, 424 204" />
    <path d="M 560 126 L 560 194" />
    <path d="M 915 126 C 885 164, 785 176, 696 204" />
    <path d="M 452 272 C 360 314, 244 322, 190 354" />
    <path d="M 560 278 L 560 354" />
    <path d="M 668 272 C 760 314, 876 322, 930 354" />
  </g>
  <g font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="600" text-anchor="middle">
    <rect x="400" y="190" width="320" height="88" rx="22" fill="#d6e4de" stroke="#55746d" stroke-width="3" />
    <text x="560" y="229" fill="#203832">사람의 판단과 역량</text>
    <text x="560" y="257" fill="#36564c" font-size="16">선택의 폭은 조건에 따라 달라짐</text>
    <rect x="62" y="354" width="256" height="72" rx="18" fill="#f1e9d9" stroke="#c6b79c" stroke-width="2" />
    <text x="190" y="398" fill="#40372a">이동</text>
    <rect x="432" y="354" width="256" height="72" rx="18" fill="#e8efeb" stroke="#9db3a9" stroke-width="2" />
    <text x="560" y="398" fill="#203832">정착·생활</text>
    <rect x="802" y="354" width="256" height="72" rx="18" fill="#e9e5f0" stroke="#b3a8c7" stroke-width="2" />
    <text x="930" y="398" fill="#392f48">다시 이동·귀환</text>
  </g>
  <path d="M 190 438 C 345 482, 775 482, 930 438" fill="none" stroke="#55746d" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <rect x="334" y="432" width="452" height="52" rx="16" fill="#fbf8f1" />
  <text x="560" y="465" fill="#203832" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="600" text-anchor="middle">난민과 지역 사회가 지원과 결정에 함께 참여</text>
</svg>
