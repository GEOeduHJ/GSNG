    <path d="M 560 115 L 560 190" />
    <path d="M 834 124 C 740 150, 697 184, 654 216" />
    <path d="M 286 376 C 380 350, 423 316, 466 284" />
    <path d="M 560 385 L 560 310" />
    <path d="M 834 376 C 740 350, 697 316, 654 284" />
  </g>
