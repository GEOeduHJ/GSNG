      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55746d" />
    </marker>
  </defs>
  <rect width="1120" height="500" rx="28" fill="#fbf8f1" />
  <g fill="none" stroke="#78948b" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)">
