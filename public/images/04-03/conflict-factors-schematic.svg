    <text x="560" y="94" fill="#40372a">영토·경계</text>
    <rect x="816" y="76" width="230" height="96" rx="20" fill="#e9edf1" stroke="#aab7c5" stroke-width="2" />
    <text x="931" y="134" fill="#263642">자원·생계</text>
    <rect x="74" y="328" width="230" height="96" rx="20" fill="#f0e9e9" stroke="#c5aaaa" stroke-width="2" />
    <text x="189" y="386" fill="#493333">정체성·대표성</text>
    <rect x="445" y="368" width="230" height="96" rx="20" fill="#ecebdc" stroke="#b9b89b" stroke-width="2" />
    <text x="560" y="426" fill="#3d3b2a">환경·경제 여건</text>
