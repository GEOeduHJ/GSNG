<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">분쟁 요인의 상호작용</title>
  <desc id="svg-desc">서로 다른 정치·공간·사회·경제 조건이 상호작용하며 분쟁의 전개에 영향을 준다.</desc>
  <defs>
