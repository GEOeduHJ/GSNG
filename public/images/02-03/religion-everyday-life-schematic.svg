<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="종교 전통과 지역, 공동체, 개인의 해석이 식사·시간과 의례·공동체 관계·공간과 경관에 서로 영향을 주며 실천은 사람마다 다를 수 있음을 나타낸 개념도">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#527b6e" />
    </marker>
  </defs>
  <rect x="360" y="250" width="480" height="180" rx="32" fill="#e2eee8" stroke="#527b6e" stroke-width="4" />
  <text x="600" y="306" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#26332e">종교 전통</text>
  <text x="600" y="350" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#34483f">지역과 공동체의 맥락</text>
  <text x="600" y="391" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#34483f">개인의 해석과 선택</text>

  <rect x="70" y="75" width="310" height="112" rx="24" fill="#f1e8d8" stroke="#9b7a4f" stroke-width="3" />
  <text x="225" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2f302d">식사와 재료</text>
  <text x="225" y="157" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a4b45">음식 선택과 정보</text>

  <rect x="820" y="75" width="310" height="112" rx="24" fill="#e8e7f0" stroke="#77718c" stroke-width="3" />
  <text x="975" y="122" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2f302d">시간과 의례</text>
  <text x="975" y="157" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a4b45">기념일과 일정</text>

  <rect x="70" y="520" width="310" height="112" rx="24" fill="#e8e7f0" stroke="#77718c" stroke-width="3" />
  <text x="225" y="567" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2f302d">공동체 관계</text>
  <text x="225" y="602" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a4b45">모임과 참여 방식</text>

  <rect x="820" y="520" width="310" height="112" rx="24" fill="#f1e8d8" stroke="#9b7a4f" stroke-width="3" />
  <text x="975" y="567" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#2f302d">공간과 경관</text>
  <text x="975" y="602" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a4b45">예배와 만남의 장소</text>

  <path d="M 380 190 C 430 220, 465 235, 500 254" fill="none" stroke="#527b6e" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path d="M 820 190 C 770 220, 735 235, 700 254" fill="none" stroke="#527b6e" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path d="M 380 525 C 430 495, 465 465, 500 431" fill="none" stroke="#527b6e" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path d="M 820 525 C 770 495, 735 465, 700 431" fill="none" stroke="#527b6e" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <text x="600" y="685" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#40544b">같은 전통 안에도 다양한 생활 방식과 필요가 있다</text>
</svg>
