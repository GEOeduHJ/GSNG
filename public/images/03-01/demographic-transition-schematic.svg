<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title" lang="ko">인구 변천 모형 개념도</title>
  <desc id="desc" lang="ko">첫 국면에는 출생률과 사망률이 비슷하게 높고 인구가 거의 늘지 않는다. 이후 사망률이 먼저 낮아지고 출생률이 뒤따라 낮아진다. 마지막에는 사망률이 출생률보다 조금 높아져 자연 감소가 나타날 수 있다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4b5e55" />
    </marker>
  </defs>
  <rect width="1120" height="620" fill="#fbf8f1" />
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#26352f">
    <rect x="118" y="112" width="170" height="66" rx="12" fill="#e8eee8" />
    <text x="203" y="139"><tspan x="203">비슷하게 높은</tspan><tspan x="203" dy="21">출생률·사망률</tspan></text>
    <rect x="288" y="112" width="170" height="66" rx="12" fill="#e8eee8" />
    <text x="373" y="139"><tspan x="373">사망률이 먼저</tspan><tspan x="373" dy="21">낮아지는 변화</tspan></text>
    <rect x="458" y="112" width="170" height="66" rx="12" fill="#e8eee8" />
    <text x="543" y="139"><tspan x="543">출생률이 뒤이어</tspan><tspan x="543" dy="21">낮아지는 변화</tspan></text>
    <rect x="628" y="112" width="170" height="66" rx="12" fill="#e8eee8" />
    <text x="713" y="139"><tspan x="713">낮은 출생과</tspan><tspan x="713" dy="21">낮은 사망</tspan></text>
    <rect x="798" y="112" width="190" height="66" rx="12" fill="#e8eee8" />
    <text x="893" y="139"><tspan x="893">사망률이 출생률보다</tspan><tspan x="893" dy="21">조금 높은 국면</tspan></text>
  </g>

  <g stroke="#d5ddd6" stroke-width="1" stroke-dasharray="5 7">
    <path d="M288 190 V438" />
    <path d="M458 190 V438" />
    <path d="M628 190 V438" />
    <path d="M798 190 V438" />
  </g>
  <text x="54" y="216" fill="#59665f" font-size="15" font-family="sans-serif">상대적</text>
  <text x="54" y="238" fill="#59665f" font-size="15" font-family="sans-serif">수준</text>
  <path d="M118 440 H1005" fill="none" stroke="#4b5e55" stroke-width="2" marker-end="url(#arrow)" />
  <text x="536" y="472" fill="#59665f" font-size="15" font-family="sans-serif" text-anchor="middle">변화의 흐름</text>

  <path d="M130 230 C220 229 280 230 340 232 C410 234 455 239 515 278 C575 318 643 375 730 380 C810 383 882 381 948 380" fill="none" stroke="#b65f48" stroke-width="6" stroke-linecap="round" />
  <path d="M130 238 C210 240 275 275 340 335 C400 385 465 393 570 395 C700 398 830 397 900 377 C920 372 936 370 948 370" fill="none" stroke="#4e7890" stroke-width="6" stroke-linecap="round" />
  <path d="M130 421 C220 421 280 419 340 405 C405 390 458 365 515 350 C590 331 660 322 730 322 C810 322 882 331 948 342" fill="none" stroke="#56836d" stroke-width="7" stroke-linecap="round" />

  <g font-family="sans-serif" font-size="16" font-weight="700">
    <text x="966" y="395" fill="#914733">출생률</text>
    <text x="966" y="368" fill="#3c657c">사망률</text>
    <text x="966" y="346" fill="#3f6d56">총인구</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#59665f">
    <line x1="130" y1="526" x2="171" y2="526" stroke="#b65f48" stroke-width="6" stroke-linecap="round" />
    <text x="182" y="531">출생률</text>
    <line x1="310" y1="526" x2="351" y2="526" stroke="#4e7890" stroke-width="6" stroke-linecap="round" />
    <text x="362" y="531">사망률</text>
    <line x1="490" y1="526" x2="531" y2="526" stroke="#56836d" stroke-width="7" stroke-linecap="round" />
    <text x="542" y="531">총인구</text>
  </g>
</svg>
