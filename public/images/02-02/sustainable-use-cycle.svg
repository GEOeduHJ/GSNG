      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#2f6f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1100" height="480" fill="#fbf8f1"/>
  <g fill="none" stroke="#2f6f5e" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)">
