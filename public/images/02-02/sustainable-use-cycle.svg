<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-label="지역의 생활과 필요, 지형과 생태계의 상태, 이용 방식, 관찰과 참여를 살피고 조정하는 지속가능한 이용의 순환">
  <defs>
