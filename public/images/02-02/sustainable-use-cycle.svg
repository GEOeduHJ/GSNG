    <rect x="55" y="295" width="390" height="130" rx="22"/>
  </g>
  <circle cx="550" cy="240" r="86" fill="#e9f0e8" stroke="#2f6f5e" stroke-width="4"/>
  <g fill="#272923" font-family="sans-serif" font-size="24" text-anchor="middle">
