sources:
  fao-food-balances:
    sourceDate: '2023'
    checkedAt: '2026-11-27'
    licenseStatus: '자료 통계의 라이선스와 출처 표기는 자료 manifest를 따름. FAO 웹페이지의 원문·이미지는 재배포하지 않음.'
    reuseBasis: 'FAOSTAT Food Balances의 식품 공급 열량 지표와 국가 단위 공급량 해석 한계를 확인하는 공식 출처.'
