    url: https://www.basel.int/implementation/plasticwaste/plasticwasteamendments/faqs/tabid/8427/default.aspx
    sourceDate: 2019
    checkedAt: '2026-11-27'
    licenseStatus: 공식 협약 안내 페이지를 사실 확인에만 사용했으며 본문이나 도표를 복제하지 않았다.
    reuseBasis: 플라스틱 폐기물의 국가 간 이동과 통제 절차에 관한 협약 개정을 확인했다.
    verificationStatus: 플라스틱 폐기물 개정안의 범위와 적용 시점을 협약 사무국 자료에서 확인했다.
