    checkedAt: '2026-11-27'
    licenseStatus: 공식 협약 설명 페이지를 사실 확인에만 사용했으며 본문이나 도표를 복제하지 않았다.
    reuseBasis: 오존층 파괴 물질의 생산과 소비를 줄이기 위한 국제 약속을 확인했다.
    verificationStatus: 협약의 목적과 당사국 이행 절차를 공식 페이지에서 확인했다.
    usage: 환경 문제 해결을 위한 국제 협약의 사례로 든다.
  basel-plastic-waste-amendments:
