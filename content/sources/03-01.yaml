sources:
  undesa-population-distribution:
    title: 'Chapter IX: Factors Affecting Population Distribution'
    organization: United Nations Department of Economic and Social Affairs
    url: https://www.un.org/development/desa/pd/sites/www.un.org.development.desa.pd/files/files/documents/2020/Jan/un_1953_determinantsandconsequencesofpopulationtrends_0.pdf
    sourceDate: '1953'
    checkedAt: '2026-11-27'
    licenseStatus: 공식 보고서 링크만 참고하며 PDF 표·그림은 재배포하지 않음.
    reuseBasis: 기후·지형·토양 등 자연 조건과 경제 활동·사회 조직·인구 이동이 인구 분포와 맺는 관계를 설명하는 참고 출처.
    verificationStatus: Chapter IX에서 지리·문화·인구 요인의 분류와 자연·문화 요인의 상호작용을 확인함.
    usage: 보고서의 시대별 수치나 당시의 구체적 설명은 사용하지 않고 요인들이 함께 작용한다는 개념에 한정함.
  national-geographic-geography-standard-16:
    title: Geography Standard 16
    organization: National Geographic Society
    url: https://education.nationalgeographic.org/resource/geography-standard-16/
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: 교육 자료 링크만 참고하며 페이지의 문장과 자료는 재배포하지 않음.
    reuseBasis: 자원 위치와 일자리, 필요와 기술 변화가 인구 분포와 정착에 미치는 관계를 설명하는 교육 자료.
    verificationStatus: 자원·고용과 인구 분포의 관계 및 필요와 기술 변화에 따라 정착 양상이 달라질 수 있음을 확인함.
    usage: 자연 조건만으로 정착을 설명하지 않고 경제 활동과 기술의 변화도 함께 살핌.
  undesa-population-ageing:
    title: Population Ageing
    organization: United Nations Department of Economic and Social Affairs, Population Division
    url: https://www.un.org/development/desa/pd/content/population-ageing
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: 공식 설명 페이지 링크만 참고하며 페이지의 개별 자료는 재배포하지 않음.
    reuseBasis: 출산율 변화에 따른 연령 구조의 변화와 인구 고령화가 노동시장·가구·사회 보호·교육·보건에 갖는 함의를 확인하는 출처.
    verificationStatus: 출산율 하락 뒤 노동 연령 인구 비중 변화와 이후 고령화가 나타날 수 있고 여러 사회 제도에 영향을 준다는 설명을 확인함.
    usage: 고령화를 단일한 위기로 묘사하지 않고 국가별 조건과 대응에 따라 영향이 달라질 수 있음을 설명함.
  undesa-demographic-dividend:
    title: 'Policy Brief No. 161: On the path to an older population: Maximizing the benefits from the demographic dividend in the least developed countries'
    organization: United Nations Department of Economic and Social Affairs, Population Division
    url: https://desapublications.un.org/policy-briefs/un-desa-policy-brief-no-161-path-older-population-maximizing-benefits-demographic
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: 공식 정책 요약 링크만 참고하며 페이지의 표·그림은 재배포하지 않음.
    reuseBasis: 연령 구조 변화가 기회로 이어지려면 교육·보건·성평등·일자리 등 정책 조건이 중요하다는 점을 확인하는 출처.
    verificationStatus: 요약에서 출산율 하락에 따른 연령 구조 변화와 인구 배당의 잠재적 기회, 이를 뒷받침할 정책 조건을 확인함.
    usage: 젊은 인구가 많다는 사실만으로 경제 성과가 자동으로 생긴다고 설명하지 않음.
  iom-migration-drivers:
    title: 'Why do people migrate? — World Migration Report Educators Toolkit'
    organization: International Organization for Migration
    url: https://wmr-educatorstoolkit.iom.int/module-3-why-do-people-migrate-instructions
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: 교육 자료 링크만 참고하며 페이지의 학습 자료는 별도 이용 조건을 확인하지 않고 재배포하지 않음.
    reuseBasis: 이주 동인이 경제·사회·환경·분쟁 등 여러 요인과 개인별 이동 선택의 범위에 따라 달라짐을 설명하는 출처.
    verificationStatus: IOM 교육 모듈에서 여러 동인이 함께 작용하며 이동이 자발적·강제적 조건의 연속선상에 놓일 수 있음을 확인함.
    usage: 배출·흡인 요인은 설명을 돕는 틀로 쓰고 개인의 이동을 하나의 이유나 동일한 선택으로 일반화하지 않음.
  world-bank-wdr2023-migration:
    title: 'World Development Report 2023: Migrants, Refugees, and Societies'
    organization: World Bank
    url: https://www.worldbank.org/en/publication/wdr2023
    sourceDate: '2023'
    checkedAt: '2026-11-27'
    licenseStatus: 보고서 설명 페이지 링크만 참고하며 보고서의 표·그림은 재배포하지 않음.
    reuseBasis: 이주민·출발 국가·도착 국가의 효과가 기술과 일자리의 적합성, 권리와 정책에 따라 다르며 송금·지식 이전과 노동·사회 통합 과제가 함께 나타날 수 있음을 설명하는 출처.
    verificationStatus: 보고서 요약에서 출발지의 송금·지식 이전과 이주로 인한 일부 가족·지역의 과제, 도착지 노동시장 기여와 공공 서비스·사회 통합 과제를 확인함.
    usage: 이주 효과를 자동으로 긍정적이거나 부정적인 것으로 설명하지 않고 조건과 정책에 따라 달라짐을 함께 밝힘.
  iom-migration-contributions:
    title: 'Migrants’ Contributions — World Migration Report Educators Toolkit'
    organization: International Organization for Migration
    url: https://wmr-educatorstoolkit.iom.int/module-12-migrants-contributions-resources
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: 교육 자료 링크만 참고하며 페이지의 학습 자료는 별도 이용 조건을 확인하지 않고 재배포하지 않음.
    reuseBasis: 이주민의 사회문화·시민 참여·경제 활동 기여가 출발지와 도착지에서 다양하게 나타날 수 있음을 설명하는 교육 자료.
    verificationStatus: IOM 교육 자료에서 이주민의 사회문화적·시민 참여·경제적 기여와 개인별 다양한 역할을 다루는 점을 확인함.
    usage: 이주민을 단일한 역할이나 문화로 묶지 않고 지역 사회의 다양한 참여자로 다룸.
  world-bank-wdi-03-01:
    title: World Development Indicators — population and employment indicators
    organization: World Bank
    url: https://api.worldbank.org/v2/
    relatedUrls:
      - https://data.worldbank.org/indicator/SP.DYN.CBRT.IN
      - https://data.worldbank.org/indicator/SP.DYN.CDRT.IN
      - https://data.worldbank.org/indicator/SP.POP.DPND.YG
      - https://data.worldbank.org/indicator/SP.POP.DPND.OL
      - https://data.worldbank.org/indicator/SL.AGR.EMPL.ZS
      - https://data.worldbank.org/indicator/SL.IND.EMPL.ZS
      - https://data.worldbank.org/indicator/SL.SRV.EMPL.ZS
      - https://data.worldbank.org/indicator/SM.POP.NETM
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: >-
      각 WDI 지표 페이지에 CC BY-4.0이 표시됨. WDI API는 World Bank가 배포하는 지표값을 제공하며,
      라이선스는 데이터 카탈로그의 공개 라이선스 안내와 각 지표 페이지를 함께 확인함.
    reuseBasis: >-
      조출생률·조사망률은 인구 1,000명당 연간 출생·사망 수, 부양비는 15–64세 인구 100명당
      연령 의존 인구 비율, 산업별 종사자 비율은 전체 종사자 중 부문별 비율, 순이동은 이민자
      유입과 유출의 차이를 나타내는 WDI 지표다.
    verificationStatus: >-
      2026-11-27 WDI API와 각 지표 원 페이지를 대조함. 조출생률·조사망률은 2024년 217/217,
      부양비는 2024년 217/217, 산업별 종사자 비율은 2024년 지표별 182/217, 순이동은
      2024년 217/217 국가·경제 코드에 값이 확인됨. 검수 기준에 따라 WPP 전망과 ILO 모형 전망 구간인
      2025년 값은 배제하고 2024년으로 통일했다. 산업별 종사자 값은 ILO 모형 추정치로 표시됨.
    usage: >-
      결측을 보간하지 않음. 부양비와 순이동은 WDI가 인용하는 UN WPP/세계은행 추정 계열이며,
      순이동을 한 해 동안의 입국자 수나 개인 경험으로 해석하지 않음. 산업별 종사자 비율은 ILO 모형
      추정치임을 캡션과 자료 안내에 밝힘.
  undesa-wpp2024-population:
    title: World Population Prospects 2024 — Demographic Indicators, Medium variant
    organization: United Nations, Department of Economic and Social Affairs, Population Division
    url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_Demographic_Indicators_Medium.csv.gz
    relatedUrls:
      - https://population.un.org/wpp/
      - https://population.un.org/dataportal/countryProfiles/types/1/topics/1/coreThemes/7/locations/231
      - https://population.un.org/wpp/assets/Excel%20Files/4_Metadata/WPP2024_Data_Sources.pdf
      - https://creativecommons.org/licenses/by/3.0/igo/
    sourceDate: '2024'
    checkedAt: '2026-11-27'
    licenseStatus: >-
      UN DESA Population Division WPP 국가 프로필은 CC BY 3.0 IGO로 표시한다. WPP 2024 Data Sources
      공식 간행물도 CC BY 3.0 IGO 재사용 조건을 밝힌다.
    reuseBasis: >-
      WPP 2024 중위 변이의 세계 총인구와 여섯 대륙 지역 TPopulation1July 계열을 사용한다.
      세계 총인구는 1950–2023년 추계와 2024–2100년 전망을 포함한다. 대륙별 비중은 같은 해
      지역 인구를 세계 인구로 나눈 파생 비율이다.
    verificationStatus: >-
      공식 WPP CSV의 LocID, LocTypeName, Variant, Time, TPopulation1July 열을 확인하고,
      세계 LocID 900과 여섯 Geographic region의 1950–2100년 자료를 추출함. 2024년 세계값과
      아프리카·아시아·유럽 비중 및 세계 1950·2100년 값은 원본 CSV를 다시 읽어 대조함.
    usage: >-
      2024년 이후 값은 중위 변이 전망으로 표시한다. 인구 단위는 천 명이며 7월 1일 기준이다.
      여섯 WPP 대륙 지역의 구분을 따르며 국가별 관측치나 인구 밀도와 혼동하지 않는다.
