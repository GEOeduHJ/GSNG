    organization: GeoNames
    url: https://www.geonames.org/export/
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: CC BY 4.0
    reuseBasis: GeoNames의 선택된 도시 대표 좌표를 사용했다. 지명·좌표를 선택하고 번역했으며 종교 범주를 추가한 수정 사항은 자료 manifest에 표시한다.
    verificationStatus: 사용한 대표 도시 레코드의 좌표와 데이터 README의 대조 기록을 확인했다. 점은 도시 중심 좌표이며 개별 성지 건축물의 위치를 뜻하지 않는다.
    usage: GeoNames 출처와 CC BY 4.0, 선택·번역·범주 분류 등 수정 사실을 표시한다.
