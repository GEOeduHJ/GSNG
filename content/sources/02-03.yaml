sources:
  pew-global-religious-change-2025:
    title: How the Global Religious Landscape Changed From 2010 to 2020
    organization: Pew Research Center
    url: https://www.pewresearch.org/religion/2025/06/09/how-the-global-religious-landscape-changed-from-2010-to-2020/
    sourceDate: '2025-06-09'
    checkedAt: '2026-11-27'
    licenseStatus: Pew Research Center 이용 약관에 따른 조건부 재사용. CC BY 아님.
    reuseBasis: 자료의 선택된 통계만 가공해 사용하며, manifest의 출처·면책·번역 고지를 화면에 표시한다. 원자료 전체나 본질적인 부분을 재게시하지 않는다.
    verificationStatus: 2025 보고서와 Appendix B의 2010·2020 국가별 및 세계 종교 구성 범위를 데이터 README와 대조했다. 이 자료는 종교 소속 인구 비율 추정치이며 신앙 실천 빈도나 인과를 측정하지 않는다.
    usage: Pew Research Center의 지정 인용 문구와 데이터 면책·번역 고지를 유지한다. 본문에서는 해석과 번역이 Pew의 책임·검토·승인을 받은 것이 아님을 밝힌다.
