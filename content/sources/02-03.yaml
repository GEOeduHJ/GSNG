sources:
  pew-global-religious-change-2025:
    title: How the Global Religious Landscape Changed From 2010 to 2020
    organization: Pew Research Center
    url: https://www.pewresearch.org/religion/2025/06/09/how-the-global-religious-landscape-changed-from-2010-to-2020/
    sourceDate: '2025-06-09'
    checkedAt: '2026-11-27'
    licenseStatus: Pew Research Center 이용 약관에 따른 조건부 재사용. CC BY 아님.
    reuseBasis: 자료의 선택된 통계만 가공해 사용하며, manifest의 출처·면책·번역 고지를 화면에 표시한다. 원자료 전체나 본질적인 부분을 재게시하지 않는다.
    verificationStatus: 2025 보고서와 Appendix B의 2010·2020 국가별 및 세계 종교 구성 범위를 데이터 README와 대조했다. 이 자료는 종교 소속 인구 비율 추정치이며 신앙 실천 빈도나 인과를 측정하지 않는다.
    usage: Pew Research Center의 지정 인용 문구와 데이터 면책·번역 고지를 유지한다. 본문에서는 해석과 번역이 Pew의 책임·검토·승인을 받은 것이 아님을 밝힌다.
  geonames-gazetteer:
    title: GeoNames Gazetteer
    organization: GeoNames
    url: https://www.geonames.org/export/
    sourceDate: null
    checkedAt: '2026-11-27'
    licenseStatus: CC BY 4.0
    reuseBasis: GeoNames의 선택된 도시 대표 좌표를 사용했다. 지명·좌표를 선택하고 번역했으며 종교 범주를 추가한 수정 사항은 자료 manifest에 표시한다.
    verificationStatus: 사용한 대표 도시 레코드의 좌표와 데이터 README의 대조 기록을 확인했다. 점은 도시 중심 좌표이며 개별 성지 건축물의 위치를 뜻하지 않는다.
    usage: GeoNames 출처와 CC BY 4.0, 선택·번역·범주 분류 등 수정 사실을 표시한다.
  harvard-pluralism-religion-guidelines:
    title: Encounter over the Curriculum
    organization: The Pluralism Project at Harvard University (American Academy of Religion guidelines referenced)
    url: https://pluralism.org/encounter-over-the-curriculum
    sourceDate: '2010'
    checkedAt: '2026-11-27'
    licenseStatus: 링크만 제공. 문장·이미지·문서 재배포 조건은 별도 확인 필요.
    reuseBasis: 종교를 학문적으로 가르칠 때 종교 내부의 다양성, 역사적 변화, 문화와의 관계를 다루도록 안내하는 방법론 참고 링크. 원문을 복제하지 않는다.
    verificationStatus: 종교 교육의 비신앙적·비홍보적 접근과 종교의 내부 다양성·역동성·문화적 맥락이라는 원칙을 페이지에서 확인했다.
    usage: 방법론 참고 링크로만 표시하고 원문 문장이나 자료를 복제하지 않는다.
  harvard-pluralism-christianity:
    title: A Worldwide Tradition
    organization: The Pluralism Project at Harvard University
    url: https://pluralism.org/a-worldwide-tradition
    sourceDate: '2020'
    checkedAt: '2026-11-27'
    licenseStatus: 링크만 제공. 문장·이미지·PDF 재배포 조건은 별도 확인 필요.
    reuseBasis: 크리스트교의 지중해 지역 역사와 예수에 관한 핵심 서술, 세계 여러 지역으로의 확산과 내부 분화에 관한 참고 링크. 원문을 복제하지 않는다.
    verificationStatus: 당시 로마 지배하 팔레스타인 지역, 지중해 공동체의 성장, 전통 내부의 여러 흐름을 설명하는 페이지 내용을 확인했다.
    usage: 역사적 개요를 요약할 때 링크를 표시하고, 하나의 설명이 모든 크리스트교 공동체의 경험을 대표하지 않도록 한다.
