items:
  - id: u0303-fdi-inflows-gdp-map
    path: /data/03-03/fdi-net-inflows-gdp-map.json
    title: 국가별 외국인 직접 투자 순유입의 GDP 대비 비율, 2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/BX.KLT.DINV.WD.GD.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators (WDI), Foreign direct investment, net inflows (% of GDP). Retrieved 2026-11-27. Modified: selected the 2024 observations and formatted them as JSON.
    script: scripts/data/03-03/world_bank.py
    unit: '% of GDP'
    year: 2024
    summary: 2024년 미국 0.85%, 중국 0.23%, 대한민국 0.69%이다. 값이 없는 국가는 null이며, FDI 유입률은 초국적 기업 활동이나 국내 부가가치 기여를 직접 측정하지 않는다.

  - id: u0303-global-fdi-inflows-series
    path: /data/03-03/fdi-global-net-inflows-series.json
    title: 세계 외국인 직접 투자 순유입액 변화, 1990–2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/BX.KLT.DINV.CD.WD
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators (WDI), Foreign direct investment, net inflows (BoP, current US$). Retrieved 2026-11-27. Modified: selected the World aggregate and 1990–2024 observations; formatted them as JSON.
    script: scripts/data/03-03/world_bank.py
    unit: current US$
    year: 2024
    summary: 세계 순 FDI 유입액은 1990년 약 2,394억 달러, 2000년 약 1조 5,694억 달러, 2024년 약 1조 3,741억 달러이다. 현재 달러 기준이므로 물가 조정 실질액은 아니다.

  - id: u0303-gdp-ppp-per-capita-map
    path: /data/03-03/gdp-ppp-per-capita-map.json
    title: 국가별 1인당 GDP, 구매력평가 기준, 2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/NY.GDP.PCAP.PP.CD
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators (WDI), GDP per capita, PPP (current international $). Retrieved 2026-11-27. Modified: selected the 2024 observations and formatted them as JSON.
    script: scripts/data/03-03/world_bank.py
    unit: current international $ per person
    year: 2024
    summary: 2024년 1인당 GDP는 구매력평가 기준으로 미국 약 86,170달러, 중국 약 27,140달러, 인도 약 10,719달러이다. 현재 국제달러 값이므로 연도 간 실질성장 비교에는 상수 PPP 시계열을 함께 본다.

  - id: u0303-gdp-ppp-constant-series
    path: /data/03-03/gdp-ppp-constant-country-series.json
    title: 소득 수준이 다른 국가의 1인당 GDP 변화, 상수 PPP 기준, 1990–2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/NY.GDP.PCAP.PP.KD
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators (WDI), GDP per capita, PPP (constant 2021 international $). Retrieved 2026-11-27. Modified: selected seven economies and 1990–2024 observations; formatted them as JSON.
    script: scripts/data/03-03/world_bank.py
    unit: constant 2021 international $ per person
    year: 2024
    summary: 2021년 구매력평가 기준으로 미국은 1990년 44,384달러, 중국은 2000년 4,066달러, 대한민국은 2024년 55,071달러이다. 미국·독일·대한민국·중국·브라질·인도·말라위의 7개국을 1990–2024년 같은 단위로 비교한다.

  - id: u0303-extreme-poverty-map
    path: /data/03-03/extreme-poverty-latest-map.json
    title: 국가별 하루 3달러 미만 인구 비율, 2015–2023년 국가별 최근 관측
    organization: World Bank, Poverty and Inequality Platform; World Development Indicators
    url: https://data.worldbank.org/indicator/SI.POV.DDAY
    retrievedAt: '2026-11-27'
    license: CC BY 4.0 (World Development Indicators)
    attribution: >-
      World Bank, Poverty and Inequality Platform, distributed through World Development Indicators. Retrieved 2026-11-27. Modified: selected each country's latest observation from 2015–2023; formatted them as JSON and recorded each observation year.
    script: scripts/data/03-03/world_bank.py
    unit: '% of population below $3.00/day (2021 PPP)'
    year: null
    summary: 하루 3달러 미만 인구 비율은 2021 PPP 기준이며, 2015–2023년 국가별 최신 관측을 사용했다. 인도는 2023년 2.6%, 방글라데시는 2022년 5.9%, 남아프리카공화국은 2022년 17.4%이고 관측 연도는 파일에 별도로 기록되어 있다.

  - id: u0303-oda-received-gni-map
    path: /data/03-03/oda-received-gni-map.json
    title: 국가별 순 공적개발원조 수원액의 GNI 대비 비율, 2023년
    organization: World Bank, World Development Indicators (WDI); OECD DAC source data
    url: https://data.worldbank.org/indicator/DT.ODA.ODAT.GN.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0 (World Development Indicators)
    attribution: >-
      World Bank, World Development Indicators (WDI), Net ODA received (% of GNI), sourced from OECD DAC statistics. Retrieved 2026-11-27. Modified: selected the 2023 observations and formatted them as JSON.
    script: scripts/data/03-03/world_bank.py
    unit: '% of GNI'
    year: 2023
    summary: 2023년 순 ODA 수원액은 GNI 대비 말라위 13.14%, 르완다 9.55%, 에티오피아 3.99%이다. 순액 지표에는 대출 상환 등으로 음수 값이 생길 수 있고, 결측은 null이다.

  - id: u0303-oda-received-constant-series
    path: /data/03-03/oda-received-constant-series.json
    title: 국가별 순 공적개발원조 수원액 변화, 1990–2023년
    organization: World Bank, World Development Indicators (WDI); OECD DAC source data
    url: https://data.worldbank.org/indicator/DT.ODA.ODAT.KD
    retrievedAt: '2026-11-27'
    license: CC BY 4.0 (World Development Indicators)
    attribution: >-
      World Bank, World Development Indicators (WDI), Net official development assistance received (constant 2023 US$), sourced from OECD DAC statistics. Retrieved 2026-11-27. Modified: selected six recipient economies and 1990–2023 observations; formatted them as JSON.
    script: scripts/data/03-03/world_bank.py
    unit: constant 2023 US$
    year: 2023
    summary: 상수 2023년 달러 기준 순 ODA 수원액은 방글라데시 1990년 약 27.7억 달러, 에티오피아 2000년 약 11.2억 달러, 파키스탄 2023년 약 39.6억 달러이다. 방글라데시·에티오피아·말라위·파키스탄·네팔·르완다의 6개국을 비교한다.
