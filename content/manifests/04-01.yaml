  - id: u0401-coal-production-top10
    path: /data/04-01/coal-production-top10.json
    title: 석탄 생산 상위 10개국, 2025년
    organization: Energy Institute; U.S. Energy Information Administration; Our World in Data
    url: https://catalog.ourworldindata.org/energy/owid_energy/
    retrievedAt: '2026-11-27'
    license: >-
      Our World in Data의 가공 자료는 CC BY 4.0이며 원출처 조건이 함께 적용된다. Energy Institute 자료는 출처 표기를 조건으로 무료 이용·복제가 허용되고, U.S. EIA 자료는 공공 도메인으로 출처 표기를 요구한다.
