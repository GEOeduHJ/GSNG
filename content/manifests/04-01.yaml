      Energy Institute (2026), Statistical Review of World Energy 2026; U.S. Energy Information Administration (2026), International Energy Data; processed by Our World in Data, Energy dataset snapshot 2026-09-10. Modified: selected 2025 coal-production values, ranked the top ten countries and translated country labels. Values are energy-equivalent production in TWh. This use does not imply endorsement.
