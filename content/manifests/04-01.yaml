  - id: u0401-energy-net-imports-map
    path: /data/04-01/energy-net-imports-map.json
    title: 국가별 에너지 순수입 비율, 2024년
    organization: World Bank WDI; International Energy Agency
    url: https://data.worldbank.org/indicator/EG.IMP.CONS.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0 (World Bank indicator page and IEA Energy Statistics Data Browser)
    attribution: >-
      World Bank, World Development Indicators, Energy imports, net (% of energy use), indicator EG.IMP.CONS.ZS; source: IEA Energy Statistics Data Browser. Modified: selected 2024 values and converted them to an ISO3 map. Positive values indicate net imports and negative values indicate net exports. This use does not imply endorsement by the World Bank or IEA.
    script: scripts/data/04-01/world_bank.py
    unit: '% of energy use'
    year: 2024
    summary: >-
      2024년 에너지 순수입 비율은 대한민국 83.2%, 중국 24.0%, 미국 -9.8%였다. 에너지 전반의 지표로 화석 연료만의 무역 수지는 아니다.
  - id: u0401-renewable-electricity-share-map
    path: /data/04-01/renewable-electricity-share-map.json
    title: 국가별 재생에너지 발전 비중, 2024년
    organization: Ember
    url: https://ember-energy.org/data/yearly-electricity-data/
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      Ember, Yearly Electricity Data (global CSV, last updated 17 November 2026), CC BY 4.0. Modified: selected 2024 country-level renewable-generation shares and converted them to an ISO3 map. This use does not imply Ember endorsement.
    script: scripts/data/04-01/ember_electricity.py
    unit: '% of electricity generation'
    year: 2024
    summary: >-
      2024년 재생에너지 발전 비중은 중국 33.158%, 미국 24.063%, 대한민국 10.467%였다. 기존 경계의 ISO3 국가 코드 중 166개에 값이 있다.
  - id: u0401-solar-capacity-top10
