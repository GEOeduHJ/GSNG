    organization: Open-Meteo (ERA5, ECMWF/Copernicus Climate Change Service)
    url: 'https://archive-api.open-meteo.com/v1/archive?latitude=37.56600&longitude=126.97840&start_date=1991-01-01&end_date=2020-12-31&daily=temperature_2m_mean%2Cprecipitation_sum&timezone=auto&models=era5'
    retrievedAt: '2026-11-26'
    license: CC BY 4.0 (Open-Meteo API data)
    attribution: 'Weather data by Open-Meteo.com; ERA5 reanalysis by ECMWF/Copernicus Climate Change Service. Monthly values calculated from daily reanalysis.'
    script: scripts/data/02-01/climate_normals.py
    unit: °C (monthly mean), mm/month (monthly precipitation mean)
    year: 2020
    summary: 서울 1991–2020년 1월 평균 기온 -2.4°C, 8월 26.0°C, 7월 평균 강수량 313.5mm이다. 관측소 관측값이 아니라 재분석 격자 자료로 계산한 값이다.
