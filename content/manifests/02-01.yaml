    title: 세계 도시 위치와 쾨펜–가이거 기후형
    organization: Beck et al. (2023), GloH2O; Natural Capital Alliance; Open-Meteo/GeoNames
    url: https://www.gloh2o.org/koppen/
    retrievedAt: '2026-11-26'
    license: CC BY 4.0 (Beck et al. climate map; GeoNames city coordinates via Open-Meteo)
    attribution: 'Climate classes from Beck et al. (2023), CC BY 4.0; coordinates from GeoNames via Open-Meteo Geocoding API. Modified: selected 9 cities, translated labels, and applied the source legend colors.'
    script: scripts/data/02-01/climate_normals.py
    unit: WGS84 decimal degrees
    year: 2020
    summary: Beck et al.의 1991–2020년 1km 기후형 지도에서 9개 도시 좌표의 분류값을 읽었다. 서울은 Dwa, 마나우스는 Af, 누크는 ET이다.
  - id: u0201-water-stress-map
    path: /data/02-01/water-stress-map.json
    title: 국가별 물 스트레스 수준, 2022년
    organization: World Bank WDI (FAO AQUASTAT 자료)
    url: 'https://api.worldbank.org/v2/country/all/indicator/ER.H2O.FWST.ZS?format=json&per_page=20000&date=2022'
    retrievedAt: '2026-11-26'
    license: CC BY 4.0 (World Bank indicator page; FAO database terms also apply)
    attribution: 'FAO AQUASTAT indicator 6.4.2, republished by World Bank WDI; accessed 2026-11-26. Modified: selected 2022 country values, rounded to 0.1 percentage point, and retained missing values as null.'
    script: scripts/data/02-01/climate_adaptation_indicators.py
    unit: '% of available freshwater resources'
    year: 2022
    summary: 2022년 값은 World Bank 국가·경제 217개 중 176개에서 확인했다. 사우디아라비아 974.2%, 이집트 141.2%, 대한민국 85.2%이며 나머지 결측은 null이다.
