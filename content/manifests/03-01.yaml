items:
  - id: u0301-population-density
    path: /data/03-01/population-density-map-2024.json
    title: 국가별 인구 밀도, 2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/EN.POP.DNST
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, CC BY 4.0. Modified: selected 2024 values and
      ISO3 country codes for a choropleth map.
    script: scripts/data/03-01/world_bank.py
    unit: persons per sq. km of land area
    year: 2024
    summary: >-
      2024년 인구 밀도는 대한민국 530.2363명/km², 인도 488.0064명/km², 미국 37.1694명/km²이다.
      217개 국가·경제 코드 가운데 214개에 값이 있고, 나머지는 원자료 결측으로 null이다.

  - id: u0301-population-top10
    path: /data/03-01/population-top10-2024.json
    title: 인구 상위 10개국, 2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/SP.POP.TOTL
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, CC BY 4.0. Modified: selected the ten largest
      country values for 2024 and translated country names into Korean.
    script: scripts/data/03-01/world_bank.py
    unit: persons
    year: 2024
    summary: >-
      2024년 인도 1,450,935,791명, 중국 1,408,975,000명, 미국 340,003,797명이다.
      세계·지역 합계는 제외하고 국가별 값만 순위화했다.

  - id: u0301-age-65plus
    path: /data/03-01/age-65plus-map-2024.json
    title: 국가별 65세 이상 인구 비율, 2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/SP.POP.65UP.TO.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, CC BY 4.0. Modified: selected 2024 values and
      ISO3 country codes for a choropleth map.
    script: scripts/data/03-01/world_bank.py
    unit: '% of total population'
    year: 2024
    summary: >-
      2024년 65세 이상 인구 비율은 일본 29.7808%, 대한민국 19.2735%, 우간다 2.1886%이다.
      217개 국가·경제 코드에 값이 있다.

  - id: u0301-population-pyramid-kor
    path: /data/03-01/pyramid-kor-2024.json
    title: 대한민국 인구 피라미드, 2024년 추계
    organization: United Nations, Department of Economic and Social Affairs, Population Division
    url: https://population.un.org/wpp/assets/Excel%20Files/1_Indicator%20(Standard)/CSV_FILES/WPP2024_PopulationByAge5GroupSex_Medium.csv.gz
    retrievedAt: '2026-11-27'
    license: CC BY 3.0 IGO
    attribution: >-
      United Nations, Department of Economic and Social Affairs, Population Division (2024),
      World Population Prospects 2024, CC BY 3.0 IGO. Modified: grouped ages into five-year
      bands and converted each sex-age count to a percentage of total population.
    script: scripts/data/03-01/wpp2024_pyramids.py
    unit: '% of total population'
    year: 2024
    summary: >-
      WPP 2024 중위 시나리오 추계에서 0–4세 남아는 전체 인구의 1.273273%, 여아는 1.206607%,
      65–69세 남성은 3.269634%이다. 모든 성별·연령 값은 2024년 전체 인구 대비 비율이다.

