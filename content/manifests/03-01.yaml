  - id: u0301-fertility-rate-series
    path: /data/03-01/fertility-rate-series-1960-2024.json
    title: 대한민국·일본·우간다·세계 합계 출산율, 1960–2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/SP.DYN.TFRT.IN
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, CC BY 4.0. Modified: selected annual values for
      the Republic of Korea, Japan, Uganda and the World from 1960–2024.
    script: scripts/data/03-01/world_bank.py
    unit: births per woman
    year: 2024
    summary: >-
      대한민국 합계 출산율은 1960년 5.994명, 2024년 0.748명이며, 2024년 세계는 2.188명,
      우간다는 4.165명이다. 네 계열 모두 1960–2024년 65개 연도 값이 있다.

  - id: u0301-international-migrant-share
    path: /data/03-01/international-migrant-share-map-2024.json
    title: 국가별 국제 이주민 비율, 2024년
    organization: World Bank, World Development Indicators (WDI), source data from UN DESA
    url: https://data.worldbank.org/indicator/SM.POP.TOTL.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, based on UN DESA International Migrant Stock,
      CC BY 4.0. Modified: selected 2024 values and ISO3 country codes for a choropleth map.
    script: scripts/data/03-01/world_bank.py
    unit: '% of total population'
    year: 2024
    summary: >-
      2024년 국제 이주민 비율은 아랍에미리트 74.0%, 미국 15.2%, 대한민국 3.5%이다.
      이는 현재 거주 인구의 이주민 비율이지 연간 이동 인원이나 이주 이유를 나타내지 않는다.

  - id: u0301-personal-remittances-gdp
    path: /data/03-01/personal-remittances-gdp-map-2024.json
    title: 국가별 개인 송금 수입의 GDP 대비 비율, 2024년
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/BX.TRF.PWKR.DT.GD.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, CC BY 4.0. Modified: selected 2024 values and
      ISO3 country codes for a choropleth map.
    script: scripts/data/03-01/world_bank.py
    unit: '% of GDP'
    year: 2024
    summary: >-
      2024년 개인 송금 수입의 GDP 대비 비율은 타지키스탄 47.1531%, 통가 39.4086%, 필리핀
      8.7247%이다. 217개 국가·경제 코드 중 162개에 값이 있고, 결측 55개는 null이다.
