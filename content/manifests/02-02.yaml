items:
  - id: u0202-usgs-earthquakes-m6
    path: /data/02-02/earthquakes-m6-2000-2025.geojson
    title: 세계 규모 6 이상 지진 분포 (2000–2025)
    organization: U.S. Geological Survey (USGS)
    url: "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&minmagnitude=6&eventtype=earthquake&catalog=us"
    retrievedAt: '2026-11-26'
    license: 미국 정부 공개 도메인 자료 (USGS ComCat US catalog; 출처 표시)
    attribution: U.S. Geological Survey, ANSS Comprehensive Earthquake Catalog (catalog=us)
    script: scripts/data/02-02/tectonic_hazards.py
    unit: WGS84 decimal degrees; magnitude (mag)
    year: 2025
    summary: 2000–2025년 규모 6 이상 지진 3,881건이다. 규모 6~6.9는 3,493건, 규모 7 이상은 388건이다. USGS 기본 상세 페이지의 우선 규모와 catalog=us 값은 다를 수 있다.

  - id: u0202-gvp-holocene-volcanoes
    path: /data/02-02/holocene-volcanoes.geojson
    title: 세계 홀로세 화산 분포
    organization: Smithsonian Institution Global Volcanism Program (GVP)
    url: "https://webservices.volcano.si.edu/geoserver/GVP-VOTW/wfs?service=WFS&version=1.0.0&request=GetFeature&typeName=GVP-VOTW%3ASmithsonian_VOTW_Holocene_Volcanoes&outputFormat=application%2Fjson"
    retrievedAt: '2026-11-26'
    license: 데이터베이스 편집물은 미국 정부 직원 저작물로 공개 도메인; Smithsonian 이용조건상 교육·비상업 이용 및 GVP 인용 준수
    attribution: Global Volcanism Program, Smithsonian Institution. Volcanoes of the World v.5.4.1 (15 Nov 2026), DOI 10.5479/si.GVP.VOTW5-2026.5.4
    script: scripts/data/02-02/tectonic_hazards.py
    unit: WGS84 decimal degrees; elevation in meters
    year: 2026
    summary: GVP 홀로세 화산 1,209개의 위치를 담았다. 홀로세 화산 목록이며 현재 활동 중인 화산만을 뜻하지 않는다. 이름은 번역하지 않고 빈 문자열로 두었다.

  - id: u0202-wdi-low-elevation-population
    path: /data/02-02/low-elevation-population-map.json
    title: 해발 5m 미만 지역 거주 인구 비율 (2015)
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/EN.POP.EL5M.ZS
    retrievedAt: '2026-11-26'
    license: CC BY 4.0
    attribution: World Bank, World Development Indicators; indicator source data from CIESIN, Columbia University
    script: scripts/data/02-02/world_bank.py
    unit: '% of total population'
    year: 2015
    summary: 최신 관측 연도인 2015년 국가별 비율이다. 217개 WDI 국가·경제 코드 중 215개에 값이 있다. 방글라데시 8.38%, 인도네시아 8.82%, 네덜란드 53.69%이다.

  - id: u0202-wdi-low-elevation-land-area
    path: /data/02-02/low-elevation-land-area-map.json
    title: 해발 5m 미만 저지대 면적 비율 (2015)
    organization: World Bank, World Development Indicators (WDI)
    url: https://data.worldbank.org/indicator/AG.LND.EL5M.ZS
    retrievedAt: '2026-11-26'
    license: CC BY 4.0
    attribution: World Bank, World Development Indicators; indicator source data from CIESIN, Columbia University
    script: scripts/data/02-02/world_bank.py
    unit: '% of total land area'
    year: 2015
    summary: 최신 관측 연도인 2015년 국가별 저지대 면적 비율이다. 217개 WDI 국가·경제 코드 중 215개에 값이 있다. 방글라데시 15.87%, 인도네시아 7.71%, 네덜란드 52.01%이다.

  - id: u0202-unesco-sagarmatha-point
    path: /data/02-02/sagarmatha-point.geojson
    title: 사가르마타 국립공원 위치 및 등재 정보
    organization: UNESCO World Heritage Centre
    url: https://whc.unesco.org/en/list/120/maps
    retrievedAt: '2026-11-26'
    license: CC-BY-SA IGO 3.0 (UNESCO listing description; source metadata attributed)
    attribution: UNESCO World Heritage Centre, Sagarmatha National Park, CC-BY-SA IGO 3.0
    script: scripts/data/02-02/sagarmatha.py
    unit: WGS84 decimal degrees; area in hectares
    year: 1979
    summary: UNESCO 공식 대표 좌표는 경도 86.91306°, 위도 27.96528°이다. 세계유산 등재 연도 1979년, 등재 면적 124,400ha이며 경계 폴리곤이나 공원 중심점은 아니다.

  - id: u0202-sagarmatha-visitors-series
    path: /data/02-02/sagarmatha-visitors-series.json
    title: 사가르마타 국립공원 회계연도 방문객 수
    organization: Sagarmatha National Park Office, Department of National Parks and Wildlife Conservation (DNPWC), Nepal
    url: https://www.snp.gov.np/uploads/download/1597001947.pdf
    retrievedAt: '2026-11-26'
    license: ©2016 Sagarmatha National Park Office; 전체 또는 일부 복제 시 문서 제목과 발행기관을 저작권자로 표기
    attribution: Sagarmatha National Park Office. Sagarmatha National Park and Its Buffer Zone Management Plan 2016–2020. ©2016 SNP.
    script: scripts/data/02-02/sagarmatha.py
    unit: visitors per fiscal year (x-axis year is fiscal year start)
    year: 2015
    summary: DNPWC 관리계획 부록 VII의 FY 1975/76–2014/15 기록이다. 1975/76년 3,600명, 2012/13년 36,650명, 2014/15년 34,412명이다. 원자료에서 빠진 7개 회계연도는 null이다.

  - id: u0202-usgs-plate-boundaries
    path: /data/02-02/plate-boundary-points.geojson
    title: 세계 판 경계 대표 위치
    organization: U.S. Geological Survey (USGS)
    url: https://earthquake.usgs.gov/arcgis/rest/services/eq/map_plateboundaries/MapServer/1/query
    retrievedAt: '2026-11-27'
    license: 미국 정부 공개 도메인 자료; USGS 출처와 원 모델 참고 문헌 표시
    attribution: >-
      U.S. Geological Survey, Tectonic Plate Boundaries; boundary model cites Bird (2003) and
      plate motion model cites DeMets, Gordon, and Argus (2010). Modified: representative points
      sampled from line features.
    script: scripts/data/02-02/plate_boundary_points.py
    unit: 경계 위치 표본
    year: null
    summary: >-
      USGS 서비스의 1,175개 선형 경계 피처를 약 350km 간격의 대표 위치 점으로 바꾸었다.
      수렴·발산·변환·기타 경계 표본 1,406개다. 점은 경계선의 근사적 분포를 나타내며 지진 발생 위치가 아니다.

  - id: u0202-wdi-international-tourism-arrivals
    path: /data/02-02/international-tourism-arrivals-1995-2020.json
    title: 국제 관광객 도착 수, 1995–2020
    organization: World Bank, World Development Indicators (WDI); source data from UN Tourism
    url: https://data.worldbank.org/indicator/ST.INT.ARVL
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, ST.INT.ARVL, CC BY 4.0; source data from UN Tourism.
      Modified: selected Nepal, Iceland, New Zealand, and Zambia series for 1995–2020; missing values
      retained as null.
    script: scripts/data/02-02/module_wdi.py
    unit: 명
    year: 2020
    summary: >-
      2020년 값은 네팔 230,000명, 아이슬란드 488,000명, 뉴질랜드 996,000명, 잠비아 502,000명이다.
      국가 전체 국제 관광객 도착 수이며 특정 지형 관광지의 방문객 수가 아니다.

  - id: u0202-wdi-terrestrial-protected-areas
    path: /data/02-02/terrestrial-protected-areas-map-2025.json
    title: 육상 보호 지역 비율, 2025년
    organization: World Bank, World Development Indicators (WDI); source data from Protected Planet
    url: https://data.worldbank.org/indicator/ER.LND.PTLD.ZS
    retrievedAt: '2026-11-27'
    license: CC BY 4.0
    attribution: >-
      World Bank, World Development Indicators, ER.LND.PTLD.ZS, CC BY 4.0; source data from
      Protected Planet, WDPA and WD-OECM, UNEP-WCMC and IUCN. Modified: 2025 values and ISO3 codes
      for a choropleth map.
    script: scripts/data/02-02/module_wdi.py
    unit: '% of total land area'
    year: 2025
    summary: >-
      2025년 217개 국가·경제 코드 가운데 213개에 값이 있다. 네팔 23.6%, 뉴질랜드 33.4%, 잠비아
      41.3%다. 지정·기록된 보전 구역의 비율로, 관리 효과나 주민 참여 정도를 직접 나타내지 않는다.

  - id: u0202-natural-earth-landforms
    path: /data/02-02/major-landforms.geojson
    title: 세계 주요 지형 지역 대표점
    organization: Natural Earth
    url: https://www.naturalearthdata.com/downloads/10m-physical-vectors/10m-physical-labels/
    retrievedAt: '2026-11-27'
    license: Natural Earth 자료는 public domain
    attribution: >-
      Natural Earth, 1:10m Geography Regions Polygons. Public domain. Modified: selected physical
      region polygons and derived one representative point per record.
    script: scripts/data/02-02/natural_earth_landforms.py
    unit: WGS84 decimal degrees; representative points
    year: null
    summary: >-
      Natural Earth 지형 지역 폴리곤에서 산지 222곳, 고원 72곳, 평야 30곳, 분지·저지대 16곳,
      계곡·협곡 9곳, 하구 평야 12곳의 대표점을 만들었다. 분포 개관용 일반화 자료이며 지질 구조나
      형성 연대를 분류하지 않는다. 대표 사례 16곳의 이름을 지도에 표시한다.
