    summary: 최신 관측 연도인 2015년 국가별 저지대 면적 비율이다. 217개 WDI 국가·경제 코드 중 215개에 값이 있다. 방글라데시 15.87%, 인도네시아 7.71%, 네덜란드 52.01%이다.

  - id: u0202-unesco-sagarmatha-point
    path: /data/02-02/sagarmatha-point.geojson
    title: 사가르마타 국립공원 위치 및 등재 정보
    organization: UNESCO World Heritage Centre
    url: https://whc.unesco.org/en/list/120/maps
    retrievedAt: '2026-11-26'
    license: CC-BY-SA IGO 3.0 (UNESCO listing description; source metadata attributed)
    attribution: UNESCO World Heritage Centre, Sagarmatha National Park, CC-BY-SA IGO 3.0
    script: scripts/data/02-02/sagarmatha.py
    unit: WGS84 decimal degrees; area in hectares
    year: 1979
    summary: UNESCO 공식 대표 좌표는 경도 86.91306°, 위도 27.96528°이다. 세계유산 등재 연도 1979년, 등재 면적 124,400ha이며 경계 폴리곤이나 공원 중심점은 아니다.

  - id: u0202-sagarmatha-visitors-series
    path: /data/02-02/sagarmatha-visitors-series.json
    title: 사가르마타 국립공원 회계연도 방문객 수
    organization: Sagarmatha National Park Office, Department of National Parks and Wildlife Conservation (DNPWC), Nepal
    url: https://www.snp.gov.np/uploads/download/1597001947.pdf
    retrievedAt: '2026-11-26'
    license: ©2016 Sagarmatha National Park Office; 전체 또는 일부 복제 시 문서 제목과 발행기관을 저작권자로 표기
    attribution: Sagarmatha National Park Office. Sagarmatha National Park and Its Buffer Zone Management Plan 2016–2020. ©2016 SNP.
    script: scripts/data/02-02/sagarmatha.py
    unit: visitors per fiscal year (x-axis year is fiscal year start)
    year: 2015
    summary: DNPWC 관리계획 부록 VII의 FY 1975/76–2014/15 기록이다. 1975/76년 3,600명, 2012/13년 36,650명, 2014/15년 34,412명이다. 원자료에서 빠진 7개 회계연도는 null이다.
