id: '02-02'
standardCode: 12세지02-02
title: 세계의 지형과 인간 생활
goal: 지형이 만들어진 과정과 사람들의 이용·적응, 개발과 보전의 쟁점을 자료를 바탕으로 설명할 수 있다.
concepts: [human-environment-interaction, landform, development-conservation-conflict, sustainable-use]
opening:
  intro: |
    지형은 지표의 높낮이와 모양을 가리킨다. 지각의 움직임과 물·바람·얼음의 작용은 산지와 평야, 해안의 모습을 오랜 시간에 걸쳐 만든다. 사람들은 이런 조건 속에서 이동하고, 거주하고, 생계를 꾸린다.

    지형은 사람들의 생활을 하나로 정하지 않는다. 사람들의 기술과 선택도 장소의 모습을 바꾸며, 같은 지형에서도 이용 방식과 부담은 다를 수 있다. 이 중단원에서는 세계의 대지형과 생활 공간을 살펴보고 관광과 보전의 관계를 자료에 근거해 설명한다.
  illustration:
    src: /images/02-02/opening.webp
    alt: 계단식 밭과 강이 흐르는 평야, 해안 마을에서 사람들이 농사와 일상을 이어간다.
  focus:
    kind: map
    step:
      id: focus
      type: map
      data: /data/02-02/earthquakes-m6-2000-2025.geojson
      source: u0202-usgs-earthquakes-m6
      caption: USGS ComCat 규모 6 이상 지진 발생 위치, 2000–2025년(2026-11-26 수집)
      alt: 2000년부터 2025년까지 규모 6 이상으로 기록된 지진의 발생 위치를 점으로 나타낸 지도다.
      config: { kind: points }
      concepts: [landform]
closing:
  summary: |
    지형은 지각 운동과 풍화·침식·퇴적 작용이 함께 만든다. 지진·화산 분포는 판의 움직임을 살피는 단서지만, 지도만으로 모든 경계나 발생 원인을 확인할 수는 없다. 산지·평야·저지대의 조건은 생활에 영향을 주지만, 국가 단위 통계는 한 지역 안의 차이나 개인의 경험까지 보여 주지 않는다.

    관광은 지형을 이용하는 한 방식이다. 방문객 수가 늘거나 줄었다는 사실만으로 지역의 이익과 환경 영향을 판단할 수 없다. 지속가능한 이용을 설명할 때에는 주민의 생활, 관광 활동, 보전 과제를 함께 살피고 자료가 보여 주지 않는 점도 밝혀야 한다.
  bridge: 다음 중단원에서는 세계의 종교와 인간 생활을 살펴보고 종교가 장소와 일상에 남기는 다양한 모습을 탐구한다.
  transfer:
    prompt: 2015년 저지대 거주 인구 비율 지도에서 새 사례로 벨기에를 골라 지도에서 확인한 비율을 기록하시오. 국가나 지역 공공기관의 공식 자료를 하나 찾아 저지대의 정착·이용 또는 위험 관리와 연결해 설명하고, 두 자료가 보여 주는 점과 보여 주지 않는 점을 구분하시오.
    step:
      id: transfer
      type: map
      data: /data/02-02/low-elevation-population-map.json
      source: u0202-wdi-low-elevation-population
      caption: 국가별 총인구 중 해발 5m 미만 저지대 거주 인구 비율, 2015년
      alt: 국가별 총인구 가운데 해발 5m 미만 저지대에 거주하는 인구의 비율을 색으로 나타낸 지도다.
      config: { kind: choropleth }
      concepts: [landform, human-environment-interaction, sustainable-use]
