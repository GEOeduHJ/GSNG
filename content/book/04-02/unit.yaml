id: '04-02'
standardCode: 12세지04-02
title: 세계의 주요 환경 문제
goal: 세계의 환경 문제를 공간 규모와 원인에 따라 살펴보고, 책임과 피해의 차이 및 여러 수준의 해결 노력을 실제 자료에 근거해 설명할 수 있다.
concepts: [environmental-problem, environmental-justice, ecological-transition, international-cooperation, human-environment-interaction, scale]
opening:
  intro: |
    환경 문제는 인간 활동과 자연 과정이 얽혀 생태계와 사람들의 삶에 영향을 주는 현상이다. 기후 변화와 산림 감소, 대기 오염은 서로 다른 원인과 공간 범위에서 나타난다. 한 지역의 활동과 영향이 여러 지역으로 이어지기도 한다.

    이 중단원에서는 기온 편차와 산림 면적 비율, 초미세먼지 노출 자료를 읽는다. 이어 배출량과 온실가스 시계열, 재생에너지 소비 비중을 살펴본다. 자료가 보여 주는 공간 규모와 범위를 확인하며 환경 문제의 원인과 대응을 설명한다.
  illustration:
    src: /images/04-02/opening.webp
    alt: 이웃들이 깨끗한 하천 주변을 정돈하고 어린 나무를 심으며 재사용 가능한 물건을 분류한다.
  focus:
    kind: chart
    step:
      id: focus
      type: chart
      data: /data/04-02/global-temperature-anomaly-1850-2025.json
      source: u0402-global-temperature
      caption: 전 지구 연평균 육지·해양 기온 편차, 1850–2025년(1991–2020년 평균 기준)
      alt: 1991–2020년 평균을 기준으로 전 지구 육지·해양의 연평균 기온 편차를 나타낸 선 그래프다.
      config: { kind: line, maxYear: 2025 }
      concepts: [environmental-problem, scale]
closing:
  summary: |
    기후 변화와 산림 감소, 대기 오염은 서로 다른 공간 규모와 원인에서 나타난다. 기온 편차는 전 지구의 장기 변화를, 산림 비율과 PM2.5 지도는 국가 간 차이를 보여 준다. 각 자료의 기준과 단위를 확인하면 같은 환경 문제를 여러 규모에서 살펴볼 수 있다.

    배출량과 피해, 대응 능력은 지역과 행위자에 따라 다르게 나타난다. 국제 협약과 정책, 기업과 지역사회의 선택, 개인의 실천을 함께 살펴 생태전환의 방향을 정한다. 효과와 비용, 지속 가능성, 참여 여건을 함께 따져 실행 방안을 제안한다.
  bridge: 다음 중단원에서는 세계 여러 지역의 분쟁이 다양한 조건 속에서 생기는 모습을 살펴보고, 공존과 평화를 위한 노력을 탐구한다.
  transfer:
    prompt: 생활폐기물 감량을 새 사례로 삼아 거주 지역 지방자치단체의 공개 자료를 찾아보시오. 자료의 기준 연도와 공간 범위를 밝히고, 환경 문제의 원인과 영향, 결정 권한과 부담의 분포를 설명하시오. 환경 정의와 생태전환 개념을 적용해 개인·학교·기업·공공기관이 함께 할 수 있는 개선안을 제안하시오.
