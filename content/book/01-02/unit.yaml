id: '01-02'
standardCode: 12세지01-02
title: 지역 변화의 역동성
goal: 지역 통합과 분리, 자치와 제도 변화의 사례를 비교하고 여러 공간 규모의 지역 변화를 자료에 근거해 설명할 수 있다.
concepts: [region, scale, regional-integration, regional-separation]
opening:
  intro: |
    지역은 자연환경과 문화·경제 관계 등 무엇을 기준으로 살피느냐에 따라 다른 범위와 지역성을 지닌다. 지역과 국가의 관계는 협력이 깊어지거나 권한과 제도가 바뀌면서 다시 구성된다.

    이 중단원에서는 RCEP와 EU의 협력 범위, 스코틀랜드의 독립 주민투표와 방사모로의 자치 사례, 통화·교역·안보·국가 제도의 변화를 살펴본다. 서로 다른 자료와 관점을 연결해 지역의 변화에 대응할 까닭을 생각한다.
  illustration:
    src: /images/01-02/opening.webp
    alt: 다리와 철도로 이어진 두 동네를 오가는 주민들과 공용 공간에서 의견을 나누는 이웃들.
  focus:
    kind: map
    step:
      id: focus
      type: map
      data: /data/01-02/rcep-membership-map.json
      source: u0102-rcep-membership-map
      caption: 역내 포괄적 경제 동반자 협정 참여 국가, 2026년
      alt: RCEP 참여국의 공간 분포를 나타낸 세계 지도다. 싱가포르는 회원 값에 포함되지만 단순화된 바탕 지도에서 별도 도형으로 보이지 않는다.
      config: { kind: choropleth, unit: '참여 여부(회원=1, 비회원=0)' }
      concepts: [region, regional-integration, scale]
closing:
  summary: |
    지역 통합은 여러 지역의 협력 범위와 규칙을 바꾸고, 지역 분리와 자치 요구는 기존의 권한과 정치 관계를 다시 조정한다. 참여·탈퇴·통화 도입·자치 제도는 서로 다른 형태로 지역의 경계와 관계가 달라지는 모습을 보여 준다.

    지역의 변화는 사람과 산업, 공동체마다 다른 기회와 조정 과제를 만든다. 변화의 원인과 영향을 파악하려면 지도·시계열·여론 자료의 기준을 확인하고 여러 관점을 함께 살펴야 한다. 다음 중단원에서는 위치와 공간 관계를 지리 정보로 나타내고 분석하는 방법을 배운다.
  bridge: 다음 중단원에서는 지리 정보와 지리정보기술을 활용해 장소의 위치와 공간 관계를 나타내고 분석한다.
  transfer:
    prompt: RCEP 참여국 지도에서 참여 범위와 지도 축척의 관계를 살펴보시오. 싱가포르가 참여 값에는 있으나 단순화된 세계 지도에서 별도 도형으로 보이지 않는 이유를 설명하고, 더 자세히 표현하려면 어떤 공간 자료와 확대 범위가 필요한지 제안하시오.
    step:
      id: transfer
      type: map
      data: /data/01-02/rcep-membership-map.json
      source: u0102-rcep-membership-map
      caption: 역내 포괄적 경제 동반자 협정 참여 국가, 2026년
      alt: RCEP 참여국의 공간 분포를 나타낸 세계 지도이며, 싱가포르 값은 포함되지만 일반화된 세계 지형에서는 따로 보이지 않는다.
      config: { kind: choropleth, unit: '참여 여부(회원=1, 비회원=0)' }
      concepts: [region, scale, regional-integration]
