id: '03-03'
standardCode: 12세지03-03
title: 글로벌 경제 체제와 공간적 불균등
goal: global value chain(글로벌 가치사슬)의 공간적 분업과 spatial inequality(공간적 불균등)의 분포·원인을 자료로 살펴보고, 국제 협력과 책임 있는 실천의 가능성과 한계를 근거를 들어 설명할 수 있다.
concepts: [glocalization, spatial-inequality, transnational-corporation, global-value-chain, international-cooperation, ethical-consumption]
opening:
  intro: |
    상품과 서비스는 여러 장소에서 이루어지는 생산·운송·판매가 이어져 만들어진다. 기업의 투자와 소비자의 구매도 다른 지역의 일과 생활에 영향을 줄 수 있다. 글로벌 경제는 이처럼 장소 사이의 경제 활동이 연결된 체계다.

    transnational corporation(초국적 기업)은 여러 나라에서 생산·판매·투자를 하며 기업 네트워크를 운영한다. 한 상품의 연구·설계, 부품 생산, 조립, 판매가 서로 다른 곳에 나뉘기도 한다. 여러 단계가 장소 사이에 이어진 구조를 글로벌 가치사슬이라 하며, 지역마다 다른 역할과 기회를 만들지만 그 이익과 부담이 고르게 돌아간다고 보장하지 않는다.

    이 중단원에서는 foreign direct investment(외국인 직접 투자, FDI), gross domestic product(국내총생산, GDP), 빈곤, official development assistance(공적개발원조, ODA) 자료를 읽는다. 자료가 드러내는 공간적 차이를 살펴보고, 국제 협력과 기업·학교·개인의 책임 있는 선택이 할 수 있는 일과 한계를 설명한다.
  illustration:
    src: /images/03-03/opening.webp
    alt: 표식 없는 책상용 조명의 설계·부품 제작·조립·판매 단계에서 여러 사람이 각자의 일을 이어 간다.
  focus:
    kind: map
    step:
      id: focus
      type: map
      data: /data/03-03/fdi-net-inflows-gdp-map.json
      source: u0303-fdi-inflows-gdp-map
      caption: 국가별 외국인 직접 투자 순유입의 국내총생산 대비 비율, 2024년
      alt: 2024년 국가별 외국인 직접 투자 순유입액이 국내총생산에서 차지하는 비율을 색으로 나타낸 지도다.
      config: { kind: choropleth }
      concepts: [transnational-corporation, spatial-inequality]
closing:
  summary: |
    초국적 기업은 여러 장소를 연결해 생산과 판매를 조직하고, 글로벌 가치사슬의 각 단계는 지역마다 다르게 놓일 수 있다. FDI 자료는 국경을 넘는 투자 흐름의 한 단면이다. 어느 장소가 어떤 생산 기능을 맡고 가치가 어떻게 나뉘는지는 FDI만으로 알 수 없다.

    1인당 GDP와 빈곤 자료는 국가 사이의 차이를 보여 주지만, 가구·지역 안의 차이나 불균등의 원인을 모두 설명하지 않는다. 국제 협력, 무역 규칙, 공정무역 기준, 기업의 책임 있는 경영과 소비자·학교의 선택은 서로 다른 수준에서 검토할 수 있다. 어느 한 방안의 효과를 단정하지 말고 영향을 받는 사람과 결정 권한, 더 필요한 근거를 함께 살펴야 한다.
  bridge: 다음 중단원에서는 에너지 자원의 생산과 소비가 장소 사이의 경제적 연결 및 공간적 불균등과 어떻게 맞물리는지 살펴본다.
  transfer:
    prompt: >-
      새 사례로 스마트폰을 골라 제조사의 공식 공급망 공개 자료와
      [OECD 책임 있는 광물 공급망 실사 지침](https://www.oecd.org/en/publications/oecd-due-diligence-guidance-for-responsible-supply-chains-of-minerals-from-conflict-affected-and-high-risk-areas_9789264185050-en.html)을 읽으시오.
      지도에서 이 단원 본문이 자세히 다루지 않은 국가 하나의 1인당 GDP(PPP)를 확인하고,
      자료에서 찾은 생산 단계와 행위자를 글로벌 가치사슬·공간적 불균등 개념으로 설명하시오.
      국가 평균 소득만으로 노동자의 임금이나 가치 배분을 단정하지 말고, 더 필요한 자료도 적으시오.
    step:
      id: transfer
      type: map
      data: /data/03-03/gdp-ppp-per-capita-map.json
      source: u0303-gdp-ppp-per-capita-map
      caption: 국가별 1인당 GDP, 구매력평가 기준, 2024년
      alt: 2024년 국가별 1인당 GDP를 구매력평가 기준 현재 국제달러로 나타낸 지도다.
      config: { kind: choropleth }
      concepts: [spatial-inequality, global-value-chain]
