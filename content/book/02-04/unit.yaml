id: '02-04'
standardCode: 12세지02-04
title: 세계의 다양한 음식과 축제
goal: 자연환경과 교류, 공동체의 실천이 음식과 축제 문화에 나타나는 모습을 실제 자료로 살펴보고, 문화 다양성을 보존할 방안을 근거를 들어 설명할 수 있다.
concepts: [glocalization, cultural-diversity, cultural-diffusion, food-culture, festival-geography]
opening:
  intro: |
    음식 문화는 재료를 기르고 얻는 환경, 조리와 나눔의 기술, 공동체의 관습이 만나 형성된다. 기후와 지형은 작물 생산에 영향을 주지만 한 나라 사람들의 음식을 하나로 정하지는 않는다. 종교적 실천과 교류, 지역의 역사도 재료를 고르고 음식을 함께 먹는 방식에 영향을 줄 수 있다.

    축제와 의례도 장소와 시기, 기억과 공동체의 참여를 담는다. 이 중단원에서는 실제 식품 공급 통계와 유네스코 무형유산 자료를 살펴본다. 자료가 보여 주는 범위와 보여 주지 않는 점을 구분하며 음식 문화와 축제의 다양성, 보존의 선택을 설명한다.
  illustration:
    src: /images/02-04/opening.webp
    alt: 다양한 사람들이 함께 음식을 준비하고 여러 음식을 나누며 작은 축하 모임을 즐긴다.
  focus:
    kind: map
    step:
      id: focus
      type: map
      data: /data/02-04/staple-rice-share-map.json
      source: staple-rice-share-map
      caption: 국가별 1인당 식품 공급 열량 중 쌀·쌀 제품의 비중, 2023년
      alt: 2023년 국가별 1인당 식품 공급 열량에서 쌀·쌀 제품이 차지하는 비중을 색으로 나타낸 지도다.
      config: { kind: choropleth }
      concepts: [food-culture]
closing:
  summary: |
    주식 작물의 공급 열량 비중은 국가별 차이를 보여 주지만 실제 섭취량이나 한 나라 안의 지역·가구 차이를 나타내지는 않는다. 음식 문화는 작물 생산 조건뿐 아니라 종교적 실천, 역사, 교류와 공동체의 선택을 함께 살펴야 이해할 수 있다.

    축제와 의례는 장소와 계절, 생업, 종교, 역사 기억이 겹치는 공동 실천이다. 유네스코 목록과 점 지도는 등재 사실과 대표 장소를 보여 주지만 공동체의 전승 상태나 내부의 다양한 목소리를 측정하지 않는다. 보존 방안은 공동체의 결정권과 전승, 지역의 이익과 부담을 함께 살펴 선택해야 한다.
  bridge: 다음 중단원에서는 인구 분포와 이동 자료를 살펴 장소 사이의 이동이 삶에 미치는 영향을 탐구한다.
  transfer:
    prompt: >-
      강강술래를 새 사례로 삼아
      [유네스코 공식 설명](https://ich.unesco.org/en/RL/ganggangsullae-00188)을 읽고,
      계절·수확 의례와 전승 주체, 장소의 관계를 축제의 지리적 의미와 문화 다양성 개념으로 설명하시오.
      등재 자료만으로 확인하기 어려운 점도 한 가지 적으시오.
