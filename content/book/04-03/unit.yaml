id: '04-03'
standardCode: 12세지04-03
title: 공존과 평화를 위한 노력
goal: 분쟁의 여러 요인과 주민의 삶을 자료로 살펴보고, 국제기구와 시민이 함께할 평화 구축 방안을 근거를 들어 제안할 수 있다.
concepts: [world-citizenship, international-cooperation, geopolitics, geopolitical-conflict, peacebuilding, global-justice]
opening:
  intro: |
    geopolitics(지정학)는 장소·영토·자원과 국가 간 힘의 관계가 국제 정세와 정책에 미치는 영향을 살피는 관점이다. geopolitical conflict(지정학적 분쟁)는 영토와 자원, 경계와 권력을 둘러싼 이해가 국제 관계와 얽혀 나타나는 갈등이다. 분쟁에는 정치·경제와 집단 정체성 등 여러 조건이 함께 작용할 수 있다.

    이 중단원에서는 조직적 폭력 사망과 무력 분쟁 수, forced displacement(강제 이주) 통계를 살펴본다. 키프로스와 골란 고원의 유엔 임무 사례, 평화 과정 자료를 바탕으로 국제 협력과 시민의 역할을 알아본다. 분쟁을 겪는 사람들의 권리와 다양한 목소리도 함께 살핀다.
  illustration:
    src: /images/04-03/opening.webp
    alt: 서로의 말을 듣는 이웃들이 대화를 나눈 뒤 함께 꽃을 심고 어린 나무에 물을 준다.
