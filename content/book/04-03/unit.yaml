      config: { kind: choropleth }
      concepts: [geopolitical-conflict, geopolitics]
closing:
  summary: |
    분쟁에는 자원·영토·정체성·정치·경제·국제 관계 등 여러 요인이 얽힐 수 있다. 사망자 지도와 무력 분쟁 시계열은 각각 조직적 폭력 관련 피해의 분포와 국가기반 분쟁 수의 변화를 보여 준다. 원인과 지역 주민의 경험은 기관 보고서와 지역 자료, 당사자의 목소리를 함께 살펴 설명한다.

    출신지·수용국 막대는 2025년 말 국외 강제 이주민의 인구 재고를, 세계 시계열은 UNHCR이 공개한 총계의 변화를 보여 준다. 유엔 평화유지활동은 정전선 감독과 합의 이행 지원 등 임무를 맡는다. 평화 구축은 갈등의 원인을 다루며 지속적인 공존의 조건을 세우는 노력이다. 세계시민은 국제 협력과 인도적 지원, 평화 교육, 공정한 소비와 연대의 역할을 근거와 기준에 따라 살핀다.
  bridge: 이 중단원은 대단원 IV의 마지막 학습으로, 지속가능한 세계를 위한 공존과 평화의 실천으로 이어진다.
  transfer:
    prompt: 나이지리아를 새로운 사례로 삼아 지도에서 조직적 폭력 관련 사망 추정치를 확인하시오. 유엔이나 지역 공공기관의 자료를 찾아 분쟁 맥락의 여러 요인을 살피고, 지정학적 분쟁·평화 구축·세계 정의 개념으로 설명하시오. 자료의 집계 범위와 지역 주민의 목소리를 함께 고려해 지속적인 공존을 위한 방안을 제안하시오.
