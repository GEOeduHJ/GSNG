      alt: 세계 인구에서 일곱 종교 범주가 차지하는 비율을 2010년과 2020년 값으로 나타낸 선그래프다.
      config: { kind: line }
      concepts: [religious-tradition, cultural-diversity]
closing:
  summary: |
    종교 인구의 분포와 종교 경관은 역사적 이동과 지역의 조건이 만난 결과다. 국가 단위 비율과 대표 도시 점은 세계의 일부 패턴을 보여 주지만, 국가 안의 차이와 개인의 신앙 실천을 대신 설명하지 않는다. 종교 전통 안에도 다양한 해석과 생활 방식이 있다.

    종교는 식사와 시간 사용, 옷차림과 공동체 공간에 서로 다른 방식으로 연결될 수 있다. 서로 다른 필요를 함께 고려하는 일은 한 집단을 문제로 삼는 일이 아니라, 참여 조건과 운영 방식을 살피는 과정이다. 자료의 범위와 당사자의 목소리를 함께 확인하면 차이와 공존을 더 구체적으로 설명할 수 있다.
  bridge: 다음 중단원에서는 음식과 축제에 담긴 생활문화의 다양성과 그 변화를 살펴본다.
  transfer:
    prompt: 공공 도서관의 모임 공간과 문화 행사 운영이라는 새 사례에 종교와 일상생활·문화 다양성 개념을 적용하시오. 세계 종교 변화 그래프가 지역 이용자의 구성을 보여 주지 않는다는 점을 밝히고, 운영안을 만들기 위해 더 필요한 지역 자료와 당사자의 의견을 제안하시오.
