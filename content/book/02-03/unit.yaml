      alt: 세계 인구에서 일곱 종교 범주가 차지하는 비율을 2010년과 2020년 값으로 나타낸 선그래프다.
      config: { kind: line }
      concepts: [religious-tradition, cultural-diversity]
closing:
  summary: |
    종교 인구의 분포와 종교 경관에는 역사적 이동과 지역 조건이 함께 드러난다. 국가별 비율과 대표 도시를 비교하면 세계의 일부 패턴을 읽을 수 있다. 나라 안의 차이와 개인의 신앙 실천은 지역 조사와 당사자의 자료를 더 살펴본다. 종교 전통 안에서도 해석과 생활 방식은 다양하다.

    종교는 식사와 시간 사용, 옷차림과 공동체 공간에 여러 방식으로 연결될 수 있다. 서로 다른 필요를 함께 고려하려면 참여 조건과 운영 방식을 살펴야 한다. 자료의 범위와 당사자의 목소리를 함께 확인해 차이와 공존을 구체적으로 설명해 보자.
  bridge: 다음 중단원에서는 음식과 축제에 담긴 생활문화의 다양성과 그 변화를 살펴본다.
  transfer:
    prompt: 공공 도서관의 모임 공간과 문화 행사 운영 사례에 종교와 일상생활·문화 다양성 개념을 적용하시오. 세계 종교 변화 그래프가 세계 인구 비율을 다룬다는 자료의 범위를 밝히고, 도서관 운영안에 필요한 지역 이용자 자료와 당사자의 의견을 제안하시오.
