id: '02-03'
standardCode: 12세지02-03
title: 세계의 종교와 인간 생활
goal: 세계 주요 종교의 분포와 특징을 자료로 비교하고, 종교가 일상생활과 경관에 미치는 영향을 차이와 공존의 관점에서 설명할 수 있다.
concepts: [religious-tradition, religious-landscape, religion-and-everyday-life, cultural-diversity, cultural-diffusion]
opening:
  intro: |
    종교 전통은 믿음과 실천이 이어지고 바뀌어 온 역사적 흐름을 담고 있다. 사람과 생각의 이동, 교역과 정치 관계는 종교가 다른 장소에 전해지는 과정과 만났다. 오늘날 한 나라 안에도 여러 종교 전통과 종교를 갖지 않은 사람들이 함께 살아간다.

    이 중단원에서는 국가별 종교 인구 비율과 종교 전통과 연결된 도시의 위치를 살펴본다. 이어 주요 종교의 역사와 가르침을 알아보고, 식사·시간·공동체 공간과 학교 운영에서 종교와 일상이 만나는 모습을 살핀다.
  illustration:
    src: /images/02-03/opening.webp
    alt: 서로 다른 연령과 배경의 사람들이 고요히 성찰하고, 식탁에서 대화하며 음식을 나눈다.
  focus:
    kind: chart
    step:
      id: focus
      type: chart
      data: /data/02-03/religion-global-share-series.json
      source: u0203-religion-global-share-series
