id: '03-01'
standardCode: 12세지03-01
title: 세계의 인구 문제와 인구 이주
goal: 세계의 인구 분포와 구조, 이주의 원인과 영향을 자료에 근거해 설명하고 서로 다른 지역과 사람의 관점을 고려한 대응을 제안할 수 있다.
concepts: [population-distribution, population-structure, international-migration, migration-impact]
opening:
  intro: |
    인구 분포와 인구 구조, 국제 이주는 사람과 장소의 관계를 살피는 관점이다. 지도와 그래프는 지역 간 양상을 비교하는 출발점이며, 지역 안의 차이는 더 세밀한 자료와 사람들의 목소리를 함께 보아야 이해할 수 있다.

    먼저 인구 밀도, 대륙별 세계 인구 비중, 국가별 총인구를 서로 다른 지표로 읽는다. 이어 세계 인구 성장과 인구 변천, 연령·산업 구조와 부양비를 살펴 인구 변화가 사회 계획과 맺는 관계를 탐구한다. 마지막으로 국제 이주의 공간적 양상과 출발지·도착지의 변화를 자료의 범위와 사람들의 선택을 함께 고려해 설명한다.
  illustration:
    src: /images/03-01/opening.webp
    alt: 새 이웃이 무지 상자와 화분을 들고 도착하고, 여러 세대의 주민들이 공동 마당에서 함께 맞이한다.
  focus:
    kind: map
    step:
      id: focus
      type: map
      data: /data/03-01/age-65plus-map-2024.json
      source: u0301-age-65plus
      caption: 국가별 65세 이상 인구 비율, 2024년
      alt: 2024년 각 국가 총인구에서 65세 이상 인구가 차지하는 비율을 색으로 나타낸 지도다.
      config: { kind: choropleth }
      concepts: [population-structure, population-distribution]
closing:
  summary: |
    인구 밀도는 면적에 견준 인구, 총인구는 전체 규모, 대륙별 비중은 세계 인구의 구성을 나타낸다. 세계 인구 전망은 가정에 따른 중위 시나리오로 읽는다. 출생률과 사망률의 변화는 인구 성장 양상에 관계하고, 연령 구조·산업별 종사자 구조·부양비는 지역의 계획 과제를 함께 살피게 한다.

    국제 이주에서는 순이동·이주민 비율·송금 비율을 서로 다른 지표로 구분한다. 국가 단위 통계는 개인의 이동 이유와 경험을 모두 설명하지 않으므로, 당사자의 선택과 지역의 다양한 목소리를 함께 살펴 대응을 제안한다.
  bridge: 다음 중단원에서는 식량 자원의 생산과 소비 자료를 살펴 세계 여러 지역의 연결과 식량 문제의 관계를 탐구한다.
  transfer:
    prompt: 독일을 새 사례로 삼아 지도에서 국제 이주민 비율을 확인하시오. 이어 독일의 지방 정부나 공공기관이 제공하는 지역 자료를 하나 찾아 국가 단위 지도와 그 자료가 각각 보여 주는 내용을 비교하시오. 이를 바탕으로 새 주민의 참여와 지역 생활을 함께 고려한 정착 지원 방안을 제안하시오.
    step:
      id: transfer
      type: map
      data: /data/03-01/international-migrant-share-map-2024.json
      source: u0301-international-migrant-share
      caption: 국가별 국제 이주민 비율, 2024년
      alt: 2024년 각 국가 총인구에서 국제 이주민이 차지하는 비율을 색으로 나타낸 지도다.
      config: { kind: choropleth }
      concepts: [international-migration, migration-impact]
