items:
  - src: /images/04-01/energy-resource-types.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 자연에서 얻는 1차 에너지를 화석 연료와 재생 에너지로
      나누고, 각 에너지원이 변환·공급을 거쳐 열·전기·연료로 쓰이는 일반 경로를 나타냈다.
      자원 이용 가치는 기술·비용·사회적 필요에 따라 달라질 수 있음을 덧붙였다. 수치·연도·
      실제 국가 사례는 넣지 않았고 교과서 그림의 배치나 표현을 재현하지 않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '04-01 lesson 1, 에너지 자원의 성격과 종류'
    alt: 자연에서 얻는 1차 에너지를 화석 연료와 재생 에너지로 나누고, 변환과 공급을 거쳐 열·전기·연료로 이용하는 개념도다.
    basis: 'U.S. EIA, Sources of Energy; U.S. EIA, Renewable energy explained: Types & uses'
    source: https://www.eia.gov/energyexplained/what-is-energy/sources-of-energy.php
  - src: /images/04-01/renewable-source-conditions.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 수력·풍력·태양광·바이오에너지·지열·해양에너지를
      행으로 나누고, 각 원천에 필요한 자연 조건과 주요 이용 방식, 지역에서 살필 요소를
      열로 비교했다. 실제 지명·수치·연도·발전 순위는 넣지 않았고 교과서 도표를 재현하지
      않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '04-01 lesson 3, 재생 에너지원과 자연 조건'
    alt: 수력·풍력·태양광·바이오에너지·지열·해양에너지의 자연 조건과 이용 방식, 지역에서 살필 요소를 비교한 개념도다.
    basis: 'U.S. EIA, Renewable energy explained: Types & uses; U.S. DOE, Marine Energy Basics'
    source: https://www.eia.gov/energyexplained/renewable-sources/types-and-usage.php
