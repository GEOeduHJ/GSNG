items:
  - src: /images/04-03/conflict-factors-schematic.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 권력과 정치 참여, 영토와 경계, 자원과 생계,
      정체성과 대표성, 환경과 경제 여건, 국제 관계가 서로 영향을 주며 분쟁의 전개에
      작용할 수 있음을 양방향 연결로 나타냈다. 특정 지역이나 집단을 단일 원인으로
      지목하지 않았고 실제 통계처럼 보이는 수치·연도·눈금을 넣지 않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '04-03 lesson 1, 여러 원인이 얽혀 분쟁이 전개된다'
    alt: '권력과 정치 참여, 영토와 경계, 자원과 생계, 정체성과 대표성, 환경과 경제 여건, 국제 관계가 상호작용한다.'
    basis: 'United Nations, Preventing conflict, sustaining peace; UCDP/PRIO Armed Conflict Dataset Codebook v26.1'
    source: https://www.un.org/en/peaceandsecurity/preventingconflictsustainingpeace
  - src: /images/04-03/displacement-agency-schematic.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 안전과 생계, 가족 관계, 제도와 정보 접근이
      사람들의 판단과 선택의 폭에 영향을 주고, 난민이 이동·정착·재이동·귀환의 과정에서
      지역 주민 및 공공기관과 함께 생활과 지원의 결정에 참여함을 표현했다. 난민을
      수동적인 피해자나 부담으로만 그리지 않았고 실제 통계처럼 보이는 수치·연도·눈금을
      넣지 않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '04-03 lesson 2, 난민은 지역의 생활과 결정에 참여하는 주체다'
    alt: '안전과 생계, 가족 관계, 제도와 정보 여건 속에서 난민이 선택을 하고 지역 사회와 함께 생활을 만들어 간다.'
    basis: 'UNHCR, Livelihoods and economic inclusion; Education in Emergencies; WHO, Refugee and migrant health'
    source: https://emergency.unhcr.org/emergency-assistance/education-and-livelihood/livelihoods-and-economic-inclusion
  - src: /images/04-03/peacebuilding-pathway-schematic.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 예방과 대화, 합의와 정전, 안전 지원, 권리와
      공공 서비스, 포용과 회복이 순환적으로 이어지고 점검·조정을 거쳐 지역의 목소리를
      반영함을 나타냈다. 평화유지활동은 정해진 임무에 따라 과정의 일부를 지원하는 것으로
      표시했으며, 평화 구축을 단일한 직선 단계나 수치 과정으로 표현하지 않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '04-03 lesson 3, 합의 뒤에도 평화 구축은 이어진다'
    alt: '예방과 대화, 합의와 안전 지원, 권리와 서비스, 포용과 회복이 서로 이어지고 점검과 조정을 통해 다시 연결된다.'
    basis: 'United Nations, Guidance on Sustaining Peace; UN Peacekeeping, Principles of peacekeeping'
    source: https://www.un.org/peacebuilding/sites/default/files/documents/guidance-on-sustaining-peace.170117.final_.pdf
