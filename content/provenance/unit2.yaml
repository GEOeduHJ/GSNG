  - src: /images/02-03/opening.webp
    prompt: |-
      Use case: illustration-story
      Asset type: opening illustration for a high-school digital textbook, unit 02-03 “World religions and human life”
      Primary request: Respectfully evoke everyday practices that can carry meaning across different religious traditions: quiet personal reflection, a small communal gathering, and neighborly care or sharing food. Give each ordinary moment equal visual weight in a calm, unlocated neighborhood scene. People from varied backgrounds participate as individuals, not as representatives of a single group. Keep the traditions intentionally unnamed and avoid visual shorthand.
      Scene/backdrop: A contemporary, ordinary shared courtyard and simple community room with a table, a few plants, and an open, quiet corner. No recognizable sacred building or location.
      Subject: Several people with varied skin tones, ages, genders, body types, and abilities. Some sit quietly in reflection, others share conversation or food, and others help one another. Ordinary contemporary clothing; no distinctive ritual attire or accessories.
      Style/medium: Restrained editorial textbook illustration, soft gouache and colored-pencil texture, simple readable forms, very subtle paper grain.
      Composition/framing: Wide 3:2; three gentle everyday moments in one connected scene, balanced equally, open space, no panels.
      Lighting/mood: Soft diffused light, dignified, warm, quiet, and welcoming.
      Color palette: Paper background near #fbf8f1, muted greens around #2f6f5e, warm off-white, light gray, and dark warm gray-brown neutrals only.
      Text (verbatim): None. Absolutely no text, letters, pseudo-writing, numerals, signs, or readable screens.
      Constraints: No actual sacred sites, religious buildings, named traditions, doctrine, or claims that one image represents a whole religion. No religious symbols of any kind: no crosses, crescents, stars, wheels, statues, prayer beads, altars, or icon-like objects. No national symbols, maps, flags, famous people, logos, labels, or watermarks.
      Avoid: Exoticizing or ranking traditions, one group defined by one outfit or action, ritual costume, iconography, stereotypes, caricature, photorealism, glossy 3D, clutter, saturated colors.
      Final edit: Replaced the single light-colored head covering on one seated person with ordinary natural dark hair to avoid visually assigning one religious marker to one person; preserved the rest of the scene.
