      Subject: Diverse people of varied ages, skin tones, genders, body types, and abilities taking part in choosing, passing, preparing, and sharing ingredients. Neutral contemporary clothing and plain unmarked utensils.
      Style/medium: Restrained editorial textbook illustration in soft gouache and colored-pencil texture, simple legible shapes, very subtle paper grain.
      Composition/framing: Wide 3:2 landscape with one coherent left-to-right flow of ingredients into cooking and shared dishes, generous open space, no panel borders, diagram labels, or arrows.
      Lighting/mood: Gentle diffused light, curious and collaborative.
      Color palette: Paper background near #fbf8f1, muted greens around #2f6f5e, warm off-white, light gray, and dark warm gray-brown neutrals; restrained natural food colors only.
      Text (verbatim): None. No text, letters, pseudo-writing, numerals, signs, labels, or readable screens.
      Constraints: Abstract decorative curves only, never geographic routes. No maps, globes, borders, flags, national symbols, country-specific landmarks, famous people, logos, brands, packaging text, or watermarks.
      Avoid: Fixed cultural categories, exoticizing any cuisine, stereotyped dress or roles, specific national dishes, caricature, photorealism, glossy 3D, clutter, saturated colors.
      Final edit: Replaced the single light head covering on one seated cook near the center-left with ordinary dark hair to avoid visually assigning one religious marker to one person; preserved the rest of the scene.
