  - src: /images/02-01/opening.webp
    prompt: |-
      Use case: illustration-story
      Asset type: opening illustration for a high-school digital textbook, unit 02-01 “World climates and human life”
      Primary request: Show how everyday life responds to different climates in one calm, continuous wide scene: a breezy shaded home with leafy shade; a snug, well-insulated home where people wear warm layers; and careful water storage beside a garden on dry ground. Three readable moments flow together without panel borders, each showing people actively adapting to their surroundings. Do not portray one place as primitive, deficient, or dangerous.
      Scene/backdrop: An invented, unlocated landscape with gentle transitions between leafy, temperate, cooler, and dry conditions. No recognizable region or architecture. Sparse, quiet background.
      Subject: A few people of varied skin tones, ages, body types, and genders going about ordinary life in each setting. Simple homes with shade and cross-breeze, visible insulated walls/roof only through a subtle architectural section, and a plain rainwater tank or covered water store beside a few cultivated plants.
      Style/medium: Restrained editorial textbook illustration with soft gouache and colored-pencil texture, simple legible shapes, very subtle paper grain. Match a calm, thoughtful schoolbook image.
      Composition/framing: Wide 3:2 landscape, three connected everyday moments in one coherent scene, generous open paper-colored space, clear at a glance. Keep people and useful climate-response details readable.
      Lighting/mood: Gentle diffused light, calm and matter-of-fact.
      Color palette: Background near #fbf8f1; muted greens around #2f6f5e for accents; warm off-white, light gray, and dark warm gray-brown neutrals only. No saturated primary or fluorescent colors.
      Text (verbatim): None. Absolutely no text, letters, pseudo-writing, numerals, signs, symbols, or readable screens anywhere.
      Constraints: No maps, globes, borders, flags, country symbols, real places, famous people, logos, labels, brands, or watermarks. Architecture must not identify a specific culture or location.
      Avoid: Any writing-like marks, signage, text on objects or screens, flags, map-like shapes or routes, national/cultural stereotypes, poverty or disaster imagery, fear, caricature, photorealism, glossy 3D, clutter, oversaturated color.
