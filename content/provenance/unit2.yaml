      Composition/framing: Wide 3:2, one coherent landscape. The trail and small restoration activity are clear at a glance; no signs or visual labels, ample negative space, not overcrowded.
      Lighting/mood: Gentle diffused daylight, thoughtful and collaborative.
      Color palette: Paper background near #fbf8f1, muted greens around #2f6f5e, restrained warm off-white, light gray, and dark warm gray-brown neutrals only.
