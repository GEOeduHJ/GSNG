  - src: /images/04-01/renewable-energy-sources.webp
    prompt: |-
      Use case: illustration-story
      Asset type: concept illustration for a Korean high-school digital geography textbook, unit 04-01, comparing renewable energy sources
      Primary request: Make the distinct natural features behind four renewable energy sources immediately legible in one coherent landscape: sunlight falls on rooftop solar panels; wind turns a few simple turbines on a ridge; flowing stream water powers a small, unobtrusive hydropower facility; and a modest community building uses a clearly visible geothermal ground-loop cutaway beneath it. Show the four sources as different practical ways of harvesting energy from sun, wind, moving water, and heat underground.
      Scene/backdrop: An invented, calm countryside neighborhood in a wide continuous landscape with soft hills, a small stream and a modest plain building. An unobtrusive cutaway of the soil beneath just one building reveals simple geothermal pipes and warm underground layers. No recognizable region.
      Subject: Solar panels, wind turbines, a small stream with modest hydropower equipment, and one clear geothermal loop beneath a building. No people are needed.
      Style/medium: Restrained editorial textbook illustration in soft gouache and colored-pencil texture, simple readable shapes, very subtle paper grain, not photorealistic or glossy.
      Composition/framing: Wide 3:2 horizontal composition, four energy sources visible at a glance and balanced across the landscape; natural transitions, generous paper-colored space, no panel borders.
      Lighting/mood: Gentle diffused daylight, calm and explanatory.
      Color palette: Background near #fbf8f1; muted greens around #2f6f5e; warm off-white, light gray, and dark warm gray-brown neutrals; restrained natural water and earth colors.
      Text (verbatim): None.
      Constraints: No text, letters, pseudo-writing, numerals, labels, arrows, symbols, logos, watermarks, signs, flags, maps, globes, borders, country symbols, real places, landmarks, or famous people. The illustration should explain through objects only.
      Avoid: Dramatic dams, flooded land, smoke, pollution, disasters, extreme weather, inaccurate energy machinery, oversized icon-like objects, diagram clutter, cultural markers, saturated colors.
    model: 'OpenAI image_gen built-in tool (underlying model not exposed)'
