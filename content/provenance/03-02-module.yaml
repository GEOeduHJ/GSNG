items:
  - src: /images/03-02/food-system-schematic.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 식량의 생산, 저장·가공, 운송·판매, 조리·소비를
      연결하고 자연환경·시장·정책·기술이 각 단계에 작용하는 구조를 나타냈다. 소비의 수요와
      선택이 생산 계획에 되돌아가는 관계도 표시했다. 수치나 특정 국가 사례는 넣지 않았다.
      교과서 그림의 배치와 표현을 따르지 않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '03-02 lesson 1, 식량 자원의 범위와 식량 체계'
    alt: '생산·저장과 가공·운송과 판매·조리와 소비가 연결되고, 자연환경·시장·정책·기술과 수요가 여러 단계에 영향을 준다.'
    basis: 'FAO, Food systems and value chains: definitions and characteristics'
    source: https://www.fao.org/climate-smart-agriculture-sourcebook/production-resources/module-b10-value-chains/b10-overview/en/?type=111
  - src: /images/03-02/food-security-dimensions.svg
    prompt: >-
      손으로 작성한 독자 SVG 개념도. 식량 안보의 가용성·접근성·활용성·안정성을 같은 비중의
      네 차원으로 배치하고, 각 차원이 식량 안보라는 결과와 연결됨을 나타냈다. 안정성은 시간에
      걸쳐 다른 차원을 지지하도록 표현했다. 수치나 특정 국가 사례는 넣지 않았고 FAO 도판을
      재현하지 않았다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '03-02 lesson 2, 식량 안보와 식량 접근'
    alt: '식량의 가용성·접근성·활용성이 서로 연결되어 식량 안보를 이루고, 안정성이 이 조건을 시간에 걸쳐 뒷받침한다.'
    basis: 'FAO, An Introduction to the Basic Concepts of Food Security'
    source: https://www.fao.org/4/al936e/al936e.pdf
