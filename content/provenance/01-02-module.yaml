items:
  - src: /images/01-02/regional-separation-drivers-schematic.svg
    prompt: >-
      고등학교 지리 학습을 위한 독자적인 개념도. 정체성·문화, 역사적 경험,
      권한과 대표성, 경제 관계가 지역의 다양한 요구와 선택에 함께 작용하고,
      선택과 협상에 따라 관계 유지·권한 조정 및 자치 확대·독립 또는 제도 이탈 등
      서로 다른 변화로 이어질 수 있음을 보여 준다. 단일 원인이나 필연적 결과를
      표현하지 않는다. 한국어 라벨은 모두 14px 이상으로 작성하고, 수치·축·제목·출처는 넣지 않는다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '01-02 lesson 2, 지역 분리와 자치 요구의 배경'
    alt: 정체성과 역사, 권한 배분과 경제 관계가 서로 얽혀 기존 관계의 유지·변경·자치 확대에 영향을 줄 수 있음을 나타낸 개념도다.
    basis: 지역 분리·자치 요구의 복합적 배경과 다원적 결과를 구분하는 교과 개념
  - src: /images/01-02/regional-dynamics-cycle-schematic.svg
    prompt: >-
      고등학교 지리 학습을 위한 독자적인 순환 개념도. 환경·관계의 변화,
      국가·지역의 선택, 제도·경계의 조정, 지역성의 변화가 서로 이어지고
      다시 다음 선택에 영향을 주는 흐름을 나타낸다. 경제·안보·제도 사례를
      같은 결과로 단정하지 않고 변화가 여러 공간 규모에 걸쳐 일어남을 강조한다.
      한국어 라벨은 모두 14px 이상으로 작성하고, 수치·축·제목·출처는 넣지 않는다.
    model: 'Codex; hand-authored SVG'
    createdAt: '2026-11-27'
    usedIn: '01-02 lesson 3, 지역 변화에 대비하는 관점'
    alt: 조건 변화와 연결의 재편이 제도와 지역성에 영향을 주고, 새 관계가 다시 지역의 대응에 영향을 미치는 순환을 나타낸 개념도다.
    basis: 지역은 통합·분리와 제도·관계 변화에 따라 재구성된다는 교과 개념
