unit: '04-01'
textbookLearningGoalMappings:
  - textbookPage: 170
    lesson: 1
    gist: 에너지 자원의 종류와 성격을 파악하고 소비 구조의 변화를 이해한다.
  - textbookPage: 172
    lesson: 2
    gist: 주요 에너지 자원의 생산과 소비 현황을 조사한다.
  - textbookPage: 176
    lesson: 3
    gist: 친환경 에너지원의 종류와 특징을 이해한다.
  - textbookPage: 180
    lesson: 3
    gist: 지속가능한 에너지 생산 방안을 평가하고 제시한다.
mappingRationale: 교과서 180쪽의 지속가능한 생산 목표는 친환경 에너지원의 특성과 지역별 조건을 활용하는 3절에 연결했다. 이에 따라 3절은 176쪽의 에너지원별 특징과 180쪽의 생산 노력·사례를 함께 다룬다.
