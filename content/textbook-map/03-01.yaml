unit: '03-01'
lessons:
  - index: 1
    textbookPages: [126, 127]
    goalGist: 자연환경과 사회·경제 조건을 함께 살펴 세계 인구 분포의 지역 차이를 설명한다.
    topics:
      - title: 인구 분포에 영향을 주는 요인
        concepts: [자연환경, 토지 생산성, 산업 발달, 교통과 기술]
        textbookMaterials: [세계 인구 밀도 지도, 고밀도 지역 사례]
        ourData: [u0301-population-density]
      - title: 세계 인구 분포의 지역 차이
        concepts: [인구 밀도, 인구 집중, 인구 희박 지역, 대륙별 차이]
        textbookMaterials: [세계 인구 밀도 지도, 대륙별 인구 밀도 통계, 인도 인구 밀도·지형 지도]
        ourData: [u0301-population-density, u0301-wpp-continent-share]
      - title: 인구 규모가 큰 국가
        concepts: [총인구, 인구 밀도와 절대 인구]
        textbookMaterials: [인구 규모 상위 국가 막대그래프]
        ourData: [u0301-population-top10]
  - index: 2
    textbookPages: [128, 131]
    goalGist: 인구 성장과 구조의 변화 과정을 파악하고 연령·산업 구조가 지역별 인구 문제와 맺는 관계를 살핀다.
    topics:
      - title: 세계 인구 성장
        concepts: [인구 증가, 인구 추계, 인구 전망]
        textbookMaterials: [세계 총인구 변화와 전망 그래프]
        ourData: [u0301-wpp-world-population]
      - title: 인구 변천의 과정
        concepts: [출생률, 사망률, 자연 증가, 인구 변천]
        textbookMaterials: [인구 변천 모형, 국가별 조출생률·조사망률 자료]
        ourData: [u0301-crude-birth-death-rates, '개념도:demographic-transition']
      - title: 연령별 인구 구조
        concepts: [유소년 인구, 생산연령 인구, 노년 인구, 인구 피라미드]
        textbookMaterials: [대륙별 연령 구조 그래프, 국가별 인구 피라미드]
        ourData: [u0301-population-pyramid-kor, u0301-population-pyramid-uga]
      - title: 산업별 인구 구조
        concepts: [산업별 종사자 비율, 농업, 산업, 서비스업]
        textbookMaterials: [주요 국가의 산업별 종사자 비율 그래프]
        ourData: [u0301-industry-employment]
      - title: 지역별 인구 문제와 대응
        concepts: [저출산, 고령화, 인구 증가, 부양 부담, 인구 정책]
        textbookMaterials: [유소년·노년 부양비 지도, 지역 사례와 대응 사례]
        ourData: [u0301-dependency-ratios]
  - index: 3
    textbookPages: [132, 135]
    goalGist: 여러 이주 동인과 이동의 공간적 양상을 구분하고 출발지와 도착지에 미치는 영향을 자료의 한계와 함께 살핀다.
    topics:
      - title: 이주 동인과 유형
        concepts: [배출 요인, 흡인 요인, 경제적 이동, 사회적 이동, 정치적 이동, 환경적 이동]
        textbookMaterials: [이주 동인 표, 이주 유형별 사례]
        ourData: ['개념도:migration-drivers-schematic']
      - title: 국제 이주의 공간적 양상
        concepts: [국제 이주, 순유입, 순유출, 이주민 비율]
        textbookMaterials: [세계 인구 이동 지도, 국가별 순이동 지도]
        ourData: [u0301-net-migration, u0301-international-migrant-share]
      - title: 출발지와 도착지의 변화
        concepts: [송금, 노동력 이동, 사회문화적 변화, 이주 정책]
        textbookMaterials: [이주 영향 사례, 국제 이주민 출신 지역 통계]
        ourData: [u0301-personal-remittances-gdp, u0301-net-migration]

