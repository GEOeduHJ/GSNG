    textbookMaterials: [핵심 개념 정리, 학습 목표 자기 점검]

rangeNote: >-
  요청 범위 72–89쪽에서 학습 목표가 있는 네 소절은 72–83쪽이다. 84–86쪽의 보충 탐구·지역 이야기는
  각각 2·3절에 연결했고, 87쪽은 중단원 정리로 기록했다. 88–89쪽은 다음 중단원 02-03의 도입이므로
  이 대응표의 소절 범위에서 제외했다. 기존 unit.yaml의 여는·닫는 질문 흐름은 유지한다.

