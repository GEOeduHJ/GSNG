      Subject: 피부색·성별 표현·연령이 다양한 청소년과 성인 이웃들, 무지 상자와 식재료, 글자 없는 휴대기기. 인물 수는 장면을 읽을 수 있을 만큼으로 제한한다.
      Style/medium: 차분한 교과서 편집 삽화, 부드러운 과슈와 색연필 질감, 단순하고 읽기 쉬운 형태, 종이결은 아주 은은하게.
