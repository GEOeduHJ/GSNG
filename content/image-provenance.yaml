      Lighting/mood: 부드러운 확산광, 차분하고 따뜻하며 사려 깊은 분위기.
      Color palette: 배경은 #fbf8f1 계열, 강조는 #2f6f5e 계열의 낮은 채도 녹색, 그 외는 따뜻한 회백색·옅은 회색·짙은 회갈색 중립색만.
      Materials/textures: 무지 종이 상자, 간결한 식재료, 부드러운 종이와 색연필의 질감.
